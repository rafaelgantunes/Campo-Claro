  const body = `${opts.nota ? `<p class="review warn" style="margin-bottom:1rem">${icon("info")} ${esc(opts.nota)}</p>` : `<div class="spread" style="margin-bottom:.8rem"><p class="muted">Responda às perguntas abaixo. Foto e observação são opcionais.</p>${hp.btn}</div>${hp.box}`}
    <div class="field"><span class="flabel"><span class="qn">1</span>O que foi perdido?</span><input type="search" id="lf-busca" placeholder="Procurar pelo nome (opcional)" aria-label="Procurar item"><div data-group="itemId" id="lf-items">${itemGrid(F.itemId)}</div>${errBox("itemId")}</div>
    <div class="field"><label for="lf-qtd"><span class="qn">2</span>Quanto se perdeu?</label>${stepper("lf-qtd", ed ? ed.qtd : opts.qtd || "", F.itemId ? item(F.itemId).un : "", "quantidade perdida")}<p class="hint" id="lf-qtd-hint">Pode ser aproximado. Ex.: 3 ou 2,5</p>${errBox("lf-qtd")}</div>
    <div class="field"><span class="flabel"><span class="qn">3</span>Qual foi a causa?</span><div class="chips" data-group="causa">${CAUSAS.map(c => chipBtn(c, c, F.causa === c)).join("")}</div>
      <div id="lf-outra" ${F.causa === "Outra causa" ? "" : "hidden"} style="margin-top:.5rem"><label class="sr" for="lf-outra-txt">Qual causa?</label><input type="text" id="lf-outra-txt" placeholder="Escreva a causa" value="${ed && !CAUSAS.includes(ed.causa) ? esc(ed.causa) : ""}"></div>${errBox("causa")}</div>
    <div class="field"><span class="flabel"><span class="qn">4</span>Em que etapa aconteceu?</span><div class="opt-grid" data-group="etapa">${ETAPAS.map(e => optBtn(e.k, e.k, e.d, F.etapa === e.k, icon(e.ic, "ic-big"))).join("")}</div>${errBox("etapa")}</div>
    <div class="field"><span class="flabel"><span class="qn">5</span>O que foi feito com o que sobrou?</span><div class="chips" data-group="destino">${DESTINOS.map(c => chipBtn(c, c, F.destino === c)).join("")}</div>${errBox("destino")}</div>

      const est = root.querySelector("#hv-est").checked, fim = root.querySelector("#hv-fim").checked;

}

      <div id="cg-quem-outro" hidden style="margin-top:.5rem"><label class="sr" for="cg-quem-txt">Nome de quem leva</label><input type="text" id="cg-quem-txt" placeholder="Nome do freteiro"></div>${errBox("quem")}</div>
    <div class="field"><label for="cg-qtd"><span class="qn">5</span>Quantidade enviada</label>${stepper("cg-qtd", "", "", "quantidade enviada")}<p class="hint" id="cg-qtd-hint"></p>${errBox("cg-qtd")}</div>
    <div class="review" id="cg-rev"></div>`;
  openSheet({ title: "Registrar saída de carga", body, back: "Cancelar", foot: `<button class="btn btn-secondary" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="button" id="cg-save">${icon("truck")}Registrar saída</button>`, onMount: root => {
    const upd = n => {
      const it = item(F.itemId);
      if (n === "itemId") {
        const ls = S.lots.filter(l => l.key === (it && it.key) && (l.colhido || l.cat === "Animal" || lotSt(l).k === "pronto")).sort((a, b) => (b.colhido || "").localeCompare(a.colhido || ""));
        F.lote = ls[0] ? ls[0].code : "sem lote";
        root.querySelector("#cg-lotes").innerHTML = it ? `<span class="flabel small">Lote</span><div class="chips" data-group="lote">${ls.map(l => chipBtn(l.code, "Lote " + l.code + (l.colhido ? ` <span class="small muted">(colhido ${relDay(l.colhido).toLowerCase()})</span>` : ""), F.lote === l.code)).join("")}${chipBtn("sem lote", "Sem lote", F.lote === "sem lote")}</div>` : "";
      }
      root.querySelector("#cg-qtd-un").textContent = it ? it.un : "";
      root.querySelector("#cg-qtd-hint").textContent = it ? `Em estoque: ${fmtN(it.qtd)} ${it.un}` : "Escolha o produto primeiro.";
      root.querySelector("#cg-outro").hidden = F.destino !== "Outro destino";
      root.querySelector("#cg-quem-outro").hidden = F.quem !== "outro";
      const d = readDate(root, F, "data") || D(0), wx = WeatherService.doDia(d);
      root.querySelector("#cg-wx").innerHTML = wx ? `<p class="review ${wx.chuva >= 50 ? "warn" : ""}">${icon(wx.ic)} Previsão para ${relDay(d).toLowerCase()}: ${esc(wx.cond.toLowerCase())}, chuva ${wx.chuva}%.${wx.chuva >= 50 ? " Saia cedo e cubra a carga com lona." : ""}</p>` : "";
      const q = parseN(root.querySelector("#cg-qtd").value);
      root.querySelector("#cg-rev").innerHTML = `<h3>${icon("info")}Confira antes de salvar</h3>${it && q > 0 ? `<p>${fmtN(q)} ${esc(it.un)} de ${esc(it.nome)}${F.destino ? " para " + esc(F.destino === "Outro destino" ? root.querySelector("#cg-outro-txt").value || "outro destino" : F.destino) : ""}, ${relDay(d).toLowerCase()}.</p><p class="saldo">Estoque: ${fmtN(it.qtd)} ${icon("chevron")} ${fmtN(Math.max(0, it.qtd - q))} ${esc(it.un)}</p>` : `<p class="muted">Preencha produto e quantidade para ver o resumo.</p>`}`;

    root.addEventListener("change", e => { if (e.target.id === "data-date") upd(); });

      const it = item(F.itemId), raw = root.querySelector("#cg-qtd").value.trim(), q = parseN(raw);

      if (q > it.qtd) {
        const a = await dialog({ title: "A quantidade é maior que o estoque registrado.", msg: `O estoque mostra ${fmtN(it.qtd)} ${esc(it.un)} de ${esc(it.nome)} e você vai enviar ${fmtN(q)} ${esc(it.un)}. Quer continuar mesmo assim? O estoque ficará em 0.`, buttons: [{ t: "Sim, continuar", v: true, cls: "btn-primary" }, { t: "Não, revisar quantidade", v: false, cls: "btn-secondary", ic: "edit" }] });
        if (!a) { root.querySelector("#cg-qtd").focus(); return; }
      }
      const sn = snap(), data = readDate(root, F, "data") || D(0);
      let quem = F.quem;
      if (quem === "outro") { const p = { id: uid("p"), nome: quemTxt, curto: quemTxt, papel: "membro", vinculo: "Freteiro", tel: "—", status: "externo", cor: "#6E6A5A" }; S.people.push(p); quem = p.id; }
      const m = stamp({ id: uid("m"), itemId: it.id, tipo: "saida", qtd: Math.min(q, it.qtd), data, por: S.me, motivo: "Transporte · " + destino, t: Date.now() }); S.movs.push(m); applyMov(m, 1);
      const s = stamp({ id: uid("s"), itemId: it.id, lote: F.lote, destino, data, quem, enviado: q, danificado: null, status: "agendada", t: Date.now() }); S.ships.push(s);
      log(`registrou saída de ${fmtN(q)} ${it.un} de ${it.nome} para ${destino}`, "truck"); save(); closeAll(); flash(s.id); goTo("producao", "transporte");
      toast(`Saída registrada: ${fmtN(q)} ${esc(it.un)} de ${esc(it.nome)} para ${esc(destino)}. Estoque: ${fmtN(it.qtd)} ${esc(it.un)}.`, "ok", () => restore(sn));
    };
  } });
}
function entregaForm(id) {
  const s = S.ships.find(x => x.id === id), it = item(s.itemId);
  const F = { causa: "Amassou ou machucou" };
  const body = `<div class="card"><div class="row"><span class="emo-box">${it.emo}</span><div><strong>${fmtN(s.enviado)} ${esc(it.un)} de ${esc(it.nome)}</strong><br>${esc(s.destino)} · ${relDay(s.data)}</div></div></div>

  openSheet({ title: "Registrar entrega", body, back: "Cancelar", foot: `<button class="btn btn-secondary" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="button" id="en-save">${icon("check")}Salvar entrega</button>`, onMount: root => {
    const upd = () => { root.querySelector("#en-extra").hidden = !(parseN(root.querySelector("#en-dan").value) > 0); };
    wireForm(root, F, upd); upd();

      const d = parseN(root.querySelector("#en-dan").value || "0");

      const sn = snap(); s.danificado = d; s.status = "entregue"; stamp(s);

      log(`registrou a entrega na ${s.destino}: ${fmtN(d)} ${it.un} danificados`, "checkCircle"); save(); closeAll(); flash(s.id); render();
      toast(`Entrega registrada.${d > 0 ? ` ${fmtN(d)} ${esc(it.un)} danificados${root.querySelector("#en-perda").checked ? " entraram no histórico de perdas" : ""}.` : " Nada danificado."}`, "ok", () => restore(sn));
    };

}

<script>
/* =========================================================

function alertView(id) {
  const a = S.alerts.find(x => x.id === id); if (!a) return;
  if (!a.lido) { a.lido = true; save(); renderShell(); }
  const n = NIVEL[a.nivel];
  const lvl = a.nivel === "baixo" ? "baixo" : a.nivel;
  const body = `<div class="card ${n.sev}"><span class="pill ${n.cls}">${icon(n.ic)}${a.nivel === "alto" ? "ATENÇÃO · " : ""}${n.txt}</span><h2 style="font-size:1.3rem;margin-top:.4rem">${esc(a.titulo)}</h2></div>
    <div class="dl" style="margin-top:1rem">
      <div><h3>${icon("info")}1. O que está acontecendo</h3><p>${esc(a.oque)}</p></div>
      <div><h3>${icon("calendar")}2. Quando</h3><p><strong>${relDay(a.quando)}</strong>, ${esc(a.hora)}.</p></div>
      <div><h3>${icon("warn")}3. Nível de risco</h3><div class="meter" role="img" aria-label="Nível de risco: ${n.txt}">${["baixo", "medio", "alto"].map(k => `<div class="${k === lvl ? "on-" + k : ""}">${k === lvl ? icon("check") + " " : ""}${{ baixo: "Baixo", medio: "Médio", alto: "Alto" }[k]}</div>`).join("")}</div></div>
      <div><h3>${icon("trendDown")}4. O que pode acontecer</h3><p>${esc(a.consequencia)}</p></div>

      <p class="small muted">${icon("clock")} Atualizado ${fmtTs(a.t).toLowerCase()} · ${WeatherService.fonte}</p>

      ${a.resolvido ? `<p class="pill pill-ok">${icon("checkCircle")}Alerta marcado como resolvido</p>` : ""}
    </div>`;
  const foot = isG() ? `<button class="btn btn-secondary" type="button" data-local="acao">${icon("check")}Registrar o que fiz</button><button class="btn btn-primary" type="button" data-local="tarefa">${icon("users")}Criar tarefa</button>`
    : `<button class="btn btn-primary" type="button" data-local="acao">${icon("check")}Registrar o que fiz</button>`;
  openSheet({ title: "Alerta", body, foot, onMount: root => root.addEventListener("click", e => {
    const b = e.target.closest("[data-local]"); if (!b) return;
    if (b.dataset.local === "acao") acaoForm(a);
    if (b.dataset.local === "tarefa") taskForm({ prefill: { nome: a.orientacao[0].replace(/\s*\(.*?\)\s*/g, " ").replace(/\.$/, "").trim(), desc: `${a.titulo} · ${relDay(a.quando)}, ${a.hora}.`, prazo: D(Math.max(0, diffDays(a.quando) - 1)), origem: a.id } });
  }), render });
  renderView();
}
function acaoForm(a) {

    <div class="field"><label for="tf-nome"><span class="qn">1</span>O que precisa ser feito?</label><input type="text" id="tf-nome" maxlength="60" value="${esc(ed ? ed.nome : pf.nome || "")}" placeholder="Ex.: Regar os canteiros" autocomplete="off">${errBox("tf-nome")}

    <div class="field"><label for="tf-desc">Explicação curta <span class="opt-tag">(opcional)</span></label><textarea id="tf-desc" maxlength="120" rows="2" placeholder="Ex.: Começar pelo canteiro perto da caixa d'água">${esc(ed ? ed.desc : pf.desc || "")}</textarea><p class="hint" id="tf-cnt"></p></div>
    <div class="field"><span class="flabel"><span class="qn">2</span>Quem vai fazer?</span><div class="chips" data-group="resp">${ppl.map(p => chipBtn(p.id, avatar(p, true) + esc(p.curto) + ` <span class="small muted">${p.papel === "gestor" ? "gestor" : esc(p.vinculo.toLowerCase())}</span>`, F.resp === p.id)).join("")}</div>${errBox("resp")}</div>
    <div class="field"><span class="flabel"><span class="qn">3</span>Até quando?</span>${dateChips("prazo", F.prazo, [[0, "Hoje"], [1, "Amanhã"], [3, "Em 3 dias"]])}</div>
    <label class="check-row" for="tf-not"><input type="checkbox" id="tf-not" checked><span><strong id="tf-not-t">Avisar a pessoa no celular</strong><br><span class="small">Ela recebe uma mensagem na tela e vibração (se estiver ligada).</span></span></label>`;

    if (s === 6) body = `<div style="text-align:center;padding-top:1rem"><span class="ic-wrap ok-ic" style="width:5rem;height:5rem;border-radius:999px;display:inline-grid;place-items:center">${icon("checkCircle", "ic-lg")}</span>
      <h2 style="font-size:1.5rem;margin-top:1rem">Tudo pronto, ${esc(O.nome.split(" ")[0])}!</h2><p class="muted" style="margin-top:.4rem">${esc(O.prop)} · ${esc(O.mun)}</p></div>
      <ul class="todo" style="margin-top:1.2rem"><li>${icon("check")}<span>Conta criada com o celular ${esc(O.tel)}</span></li><li>${icon("check")}<span>Propriedade marcada no mapa</span></li><li>${icon("check")}<span>Grupo “${esc(O.grupo)}” criado${O.convites.length ? ` e ${O.convites.length} ${plural(O.convites.length, "convite enviado", "convites enviados")} por SMS` : ""}</span></li></ul>
      <p class="demo-note" style="margin-top:1rem">${icon("info")} No protótipo, o Início vai abrir com os dados de exemplo usando o seu nome e o nome do seu sítio.</p>`;
    const head = s <= 5 ? `<div class="onb-head"><div class="in"><div class="spread"><strong>${icon("leaf")} Campo Claro</strong><span>Etapa ${s} de 5 · ${ONB_T[s - 1]}</span></div>
        <div class="steps-bar" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<div class="${i < s ? "done" : i === s ? "cur" : ""}"></div>`).join("")}</div></div></div>` : `<div class="onb-head"><div class="in"><strong>${icon("leaf")} Campo Claro</strong></div></div>`;
    const foot = s <= 5 ? `<button class="btn btn-secondary" type="button" data-o="back">${icon("back")}Voltar</button><button class="btn btn-primary" type="button" data-o="next">${s === 5 ? (O.convites.length ? "Concluir" : "Pular e concluir") : s === 2 ? "Confirmar código" : "Continuar"}${icon("chevron")}</button>`
      : `<button class="btn btn-primary" type="button" data-o="fim">${icon("home")}Ir para o Início</button>`;
    el.innerHTML = `${head}<div class="onb-body"><div class="in">${body}</div></div><div class="onb-foot"><div class="in">${foot}</div></div>`;
  }
  onbWire();
  const f = el.querySelector("input, .btn-primary"); f && setTimeout(() => f.focus(), 30);
}
function mapSvg(pin) {
  return `<svg viewBox="0 0 320 220" aria-hidden="true">
    <rect width="320" height="220" fill="#E9E3CF"/>
    <path d="M0 0h140v90H0z" fill="#CFE0B8"/><path d="M150 0h170v70H150z" fill="#DCE6C2"/><path d="M0 100h110v120H0z" fill="#D7E4BE"/><path d="M190 120h130v100H190z" fill="#C8DCAE"/>
    <path d="M200 80h110v32H200z" fill="#E4D3A8"/>
    ${Array.from({ length: 6 }, (_, i) => `<path d="M${12 + i * 20} 112v96" stroke="#A9C58C" stroke-width="5"/>`).join("")}
    <path d="M-10 160 C60 140 120 175 175 150 S270 90 330 100" stroke="#7FB2D6" stroke-width="10" fill="none"/>
    <path d="M140 0 L160 220" stroke="#B9A57D" stroke-width="12"/><path d="M140 0 L160 220" stroke="#D9CBA7" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="248" y="148" font-size="11" fill="#2F5E7D" font-family="sans-serif">Córrego</text>
    <text x="165" y="40" font-size="11" fill="#5A4A2E" font-family="sans-serif" transform="rotate(84 165 40)">Estrada</text>
    <text x="210" y="100" font-size="10" fill="#5A4A2E" font-family="sans-serif">Vila</text>
    ${pin ? `<g transform="translate(${pin.x * 3.2} ${pin.y * 2.2})"><circle r="16" fill="#1E4D2B" opacity=".18"/><path d="M0 0c-9-12-12-17-12-22a12 12 0 0 1 24 0c0 5-3 10-12 22z" fill="#9E2318" stroke="#fff" stroke-width="2"/><circle cy="-22" r="4" fill="#fff"/></g>` : ""}
  </svg>`;
}
function onbWire() {
  const el = $("#onb");
  const tel = el.querySelector("#o-tel"); tel && maskTel(tel);
  const ct = el.querySelector("#o-ct"); ct && maskTel(ct);
  $$(".otp input", el).forEach((inp, i, all) => {
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(-1); if (inp.value && all[i + 1]) all[i + 1].focus(); setErr(el, "o-c", ""); });
    inp.addEventListener("keydown", e => { if (e.key === "Backspace" && !inp.value && all[i - 1]) all[i - 1].focus(); });
  });
  const mun = el.querySelector("#o-mun");
  if (mun) {
    const list = () => { const q = mun.value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); const res = MUNICIPIOS.filter(m => !q || m.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(q)).slice(0, 6); el.querySelector("#o-mun-list").innerHTML = res.map(m => `<button type="button" class="chip" data-mun="${esc(m)}" aria-pressed="${O.mun === m}"><span class="ck">${icon("check")}</span>${icon("pin")}${esc(m)}</button>`).join("") || `<span class="muted small">Nenhum município encontrado. Confira a escrita.</span>`; };
    mun.addEventListener("input", () => { O.mun = ""; setErr(el, "o-mun", ""); list(); }); list();
  }
  const map = el.querySelector("#o-map");
  if (map) map.addEventListener("click", e => { const r = map.getBoundingClientRect(); O.pin = { x: Math.round((e.clientX - r.left) / r.width * 100), y: Math.round((e.clientY - r.top) / r.height * 100) }; map.innerHTML = mapSvg(O.pin); const st = el.querySelector("#o-pin-st"); st.className = "review"; st.innerHTML = icon("checkCircle") + " Local marcado. Toque de novo para mudar."; setErr(el, "o-pin", ""); });
  el.onclick = e => {
    const mb = e.target.closest("[data-mun]");
    if (mb) { O.mun = mb.dataset.mun; el.querySelector("#o-mun").value = O.mun; $$("[data-mun]", el).forEach(b => b.setAttribute("aria-pressed", String(b === mb))); setErr(el, "o-mun", ""); return; }
    const pb = e.target.closest("[data-p]");
    if (pb) { $$("[data-p]", el).forEach(b => b.setAttribute("aria-pressed", String(b === pb))); return; }
    const b = e.target.closest("[data-o]"); if (!b) return;
    const k = b.dataset.o;
    if (k === "fechar") { onbClose(); return; }
    if (k === "entrar") { O.step = 1; onbRender(); return; }
    if (k === "reenviar") { toast("Código reenviado por SMS. (Demonstração: 1234)", "info"); return; }
    if (k === "gps") { O.pin = { x: 56, y: 44 }; el.querySelector("#o-map").innerHTML = mapSvg(O.pin); const st = el.querySelector("#o-pin-st"); st.className = "review"; st.innerHTML = icon("checkCircle") + " Localização aproximada encontrada e marcada. Confira se o ponto está certo."; setErr(el, "o-pin", ""); return; }
    if (k === "add") {
      const n = el.querySelector("#o-cn").value.trim(), t = el.querySelector("#o-ct").value;
      let ok = setErr(el, "o-cn", n ? "" : "Escreva o nome da pessoa.");
      ok = setErr(el, "o-ct", t.replace(/\D/g, "").length < 10 ? "Celular incompleto. Escreva com DDD." : "") && ok;
      if (!ok) return;
      O.grupo = el.querySelector("#o-grupo").value;
      O.convites.push({ nome: n, tel: t, papel: el.querySelector("[data-p][aria-pressed=true]").dataset.p }); onbRender(); toast(`${esc(n)} entrou na lista de convites.`); return;
    }
    if (k === "rm") { O.grupo = el.querySelector("#o-grupo").value; O.convites.splice(+b.dataset.i, 1); onbRender(); return; }
    if (k === "back") { O.step = Math.max(0, O.step - 1); onbRender(); return; }
    if (k === "next") {
      const s = O.step;
      if (s === 1) { O.nome = el.querySelector("#o-nome").value.trim(); O.tel = el.querySelector("#o-tel").value; let ok = setErr(el, "o-nome", O.nome ? "" : "Escreva seu nome para continuar."); ok = setErr(el, "o-tel", O.tel.replace(/\D/g, "").length < 10 ? "O celular está incompleto. Escreva com DDD, por exemplo (31) 99999-9999." : "") && ok; if (!ok) return; toast(`Código enviado por SMS para ${esc(O.tel)}.`, "info"); }
      if (s === 2) { O.code = $$(".otp input", el).map(i => i.value).join(""); if (O.code.length < 4) { setErr(el, "o-c", "Digite os 4 números do código."); return; } if (O.code !== "1234") { setErr(el, "o-c", "Código errado. Confira a mensagem SMS ou toque em Reenviar código."); $$(".otp input", el).forEach(i => i.value = ""); el.querySelector("#o-c0").focus(); return; } }
      if (s === 3) { O.prop = el.querySelector("#o-prop").value.trim(); let ok = setErr(el, "o-prop", O.prop ? "" : "Escreva o nome do sítio. Pode ser só “Sítio do Geraldo”."); if (!O.mun) { setErr(el, "o-mun", "Toque no seu município na lista."); ok = false; } if (!ok) return; }
      if (s === 4 && !O.pin) { setErr(el, "o-pin", "Toque no mapa ou use “Usar minha localização” para continuar."); return; }
      if (s === 5) O.grupo = el.querySelector("#o-grupo").value.trim() || "Minha família";
      O.step++; onbRender();
    }
    if (k === "fim") {
      const ui = S.ui; S = makeSeed(); S.ui = ui;
      const p = S.people[0]; p.nome = O.nome; p.curto = O.nome.split(" ")[0]; p.tel = O.tel;
      S.prop.nome = O.prop; S.prop.municipio = O.mun; S.prop.grupo = O.grupo; S.prop.pinX = O.pin.x; S.prop.pinY = O.pin.y;
      O.convites.forEach((c, i) => S.people.push({ id: uid("p"), nome: c.nome, curto: c.nome.split(" ")[0], papel: c.papel, vinculo: "Familiar", tel: c.tel, status: "convidado", cor: AV_CORES[(i + 5) % AV_CORES.length] }));
      S.me = "p1"; save(); onbClose(); goTo("inicio"); render(); toast(`Bem-vindo, ${esc(p.curto)}! Este é o Início do ${esc(S.prop.nome)}.`);
    }
  };
}

/* =========================================================
   ROTEAMENTO, RENDERIZAÇÃO E AÇÕES
   ========================================================= */
const VIEWS = { inicio: vInicio, producao: vProducao, estoque: vEstoque, alertas: vAlertas, familia: vFamilia };
function renderView() {
  const v = $("#view"), y = window.scrollY;
  v.innerHTML = (VIEWS[U.route] || vInicio)();
  window.scrollTo(0, y);
}
function render() { renderShell(); renderView(); }
function route() {
  const h = location.hash.replace("#", "");
  if (h === "cadastro") { onbStart(); return; }
  const prev = U.route;
  U.route = VIEWS[h] ? h : "inicio";
  closeAll();
  render();
  if (prev !== U.route) { window.scrollTo(0, 0); $("#view").focus({ preventScroll: true }); }
}
window.addEventListener("hashchange", route);

const ACTIONS = {
  go: d => { if (d.lido) { const n = S.notifs.find(x => x.id === d.lido); if (n) { n.lido = true; save(); } } if (d.tab) U.tabs[d.to] = d.tab; if (U.route === d.to) { render(); window.scrollTo(0, 0); } else location.hash = d.to; },
  tab: d => { U.tabs[d.area] = d.tab; renderView(); },
  mov: () => movForm(), perda: () => lossForm(), carga: () => cargaForm(),
  "lote-novo": () => lotForm(), lote: d => lotView(d.id), item: d => itemView(d.id), "item-novo": () => itemForm(),
  "perda-ver": d => lossView(d.id), entrega: d => entregaForm(d.id),
  "carga-del": async d => { const s = S.ships.find(x => x.id === d.id), it = item(s.itemId); if (await confirmDel("Cancelar esta saída?", `${fmtN(s.enviado)} ${esc(it.un)} de ${esc(it.nome)} voltam para o estoque.`, "Sim, cancelar saída")) { const sn = snap(); it.qtd = r2(it.qtd + s.enviado); S.ships = S.ships.filter(x => x.id !== s.id); log(`cancelou a saída de ${it.nome} para ${s.destino}`, "trash"); save(); render(); toast(`Saída cancelada. Estoque de ${esc(it.nome)}: ${fmtN(it.qtd)} ${esc(it.un)}.`, "info", () => restore(sn)); } },
  "mov-edit": d => { const m = S.movs.find(x => x.id === d.id); closeAll(); movForm({ edit: m }); },
  "mov-del": d => delMov(d.id),
  alerta: d => alertView(d.id), tarefa: d => taskView(d.id), "tarefa-nova": () => taskForm(),
  "tarefa-ok": d => taskDone(d.id), "tarefa-ini": d => taskStart(d.id),
  convidar: () => inviteForm(), pessoa: d => personForm(d.id),
  reenviar: d => { const p = S.people.find(x => x.id === d.id); toast(`Convite reenviado por SMS para ${esc(p.tel)}.`, "info"); },
  calday: d => { U.filtros.calDay = d.d && U.filtros.calDay !== d.d ? d.d : null; renderView(); },
  calkind: d => { U.filtros.calKind = d.k; renderView(); },
  lotesf: d => { U.filtros.lotes = d.k; renderView(); },
  lossper: d => { U.filtros.lossPer = d.k; renderView(); }, lossby: d => { U.filtros.lossBy = d.k; renderView(); },
  stf: d => { U.filtros.estoqueSt = d.k || null; renderView(); }, movf: d => { U.filtros.movTipo = d.k; renderView(); },
  taskf: d => { U.filtros.taskSt = d.k; renderView(); }, logf: d => { U.filtros.logPessoa = d.k; renderView(); },
  pref: d => { S.prefs[d.k] = !S.prefs[d.k]; save(); render(); toast(`Preferência salva: ${S.prefs[d.k] ? "ligado" : "desligado"}.`, "info"); const b = $(`[data-action=pref][data-k="${d.k}"]`); b && b.focus(); },
  prefdias: d => { S.prefs.defensivoDias = +d.k; save(); renderView(); toast(`Lembrete de defensivo a cada ${d.k} dias.`, "info"); },
  "wx-refresh": () => { if (!U.online) { toast(`Sem internet. Mostrando a previsão salva ${fmtTs(S.wxAt).toLowerCase()}.`, "warn"); return; } S.wxAt = Date.now(); save(); render(); toast(`Previsão atualizada às ${hm(S.wxAt)}.`, "ok"); },
  letra: () => letraSheet(), bell: () => bellSheet(), perfil: () => perfilSheet(), demo: () => demoSheet()
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.actionChange === "taskpessoa") { U.filtros.taskPessoa = e.target.value; renderView(); const s = $("#taskPessoa"); s && s.focus(); }
});

/* início */
if (location.hash === "#cadastro") { U.route = "inicio"; render(); onbStart(); }
else route();
if (!U.online) goOffline(true);
</script>
