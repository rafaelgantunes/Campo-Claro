<!DOCTYPE html>
<html lang="pt-BR" data-font="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo Claro</title>
<meta name="description" content="Protótipo navegável do Campo Claro: gestão simples para agricultura familiar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plano visual: verde-escuro (identidade), creme (fundo), cores de estado com significado fixo.
   Layout: mobile-first com barra inferior; a partir de 960px vira barra lateral + grade de colunas. */
:root{
  --verde:#1E4D2B; --verde-2:#2A6339; --verde-claro:#3F8F4E; --verde-bg:#DFEEDA; --verde-txt:#1C5429;
  --creme:#F4EEDF; --cartao:#FFFBF1; --cartao-2:#F3EBD9; --borda:#DDD1B6; --borda-2:#C2B492;
  --texto:#1F251B; --texto-2:#4B5343;
  --atencao:#8F4A00; --atencao-ic:#D37406; --atencao-bg:#FBE6BF;
  --critico:#9E2318; --critico-bg:#F6DAD5;
  --info:#185A84; --info-bg:#DBE9F3; --info-borda:#B4D0E4;
  --terra:#8A5A2B;
  --foco:#F2A922;
  --fonte:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --raio:14px;
  color-scheme:light;
}
body.sol{ /* modo sol forte: mais contraste para uso ao ar livre */
  --creme:#FFFDF6; --cartao:#FFFFFF; --cartao-2:#F1ECE0; --borda:#857B63; --borda-2:#5E5644;
  --texto:#000; --texto-2:#20241C; --verde-txt:#0F3D1B; --atencao:#6E3700; --critico:#7E140B; --info:#0B4468;
}
html[data-font="0"]{font-size:16px}
html[data-font="1"]{font-size:18px}
html[data-font="2"]{font-size:20px}
html[data-font="3"]{font-size:23px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:var(--fonte);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--verde-txt)}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.35em;height:1.35em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-lg{width:1.8em;height:1.8em}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estrutura ---------- */
#app{display:flex;min-height:100%}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.sidebar{display:none}
.topbar{background:var(--verde);color:#fff;position:sticky;top:0;z-index:20}
.topbar-in{display:flex;align-items:center;gap:.25rem;padding:.35rem .5rem .35rem 1rem;max-width:1240px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:#F4EEDF;color:var(--verde);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:1.1rem;line-height:1.1}
.brand-prop{font-size:.8rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-title-top{display:none}
.top-btn{min-width:52px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:inherit;background:transparent;border:0;border-radius:12px;font-size:.72rem;font-weight:700;position:relative;padding:.2rem .3rem}
.top-btn:hover{background:rgba(255,255,255,.12)}
.badge{position:absolute;top:2px;right:4px;background:var(--foco);color:#2A1700;border-radius:999px;min-width:1.35rem;height:1.35rem;font-size:.75rem;font-weight:700;display:grid;place-items:center;padding:0 .3rem;border:2px solid var(--verde)}
.netbar{display:flex;align-items:center;gap:.45rem;padding:.35rem 1rem;font-size:.85rem;font-weight:700;border-bottom:1px solid var(--borda)}
.netbar .in{max-width:1240px;margin:0 auto;width:100%;display:flex;align-items:center;gap:.45rem}
.net-online{background:var(--verde-bg);color:var(--verde-txt)}
.net-offline{background:var(--atencao-bg);color:var(--atencao)}
.net-sync{background:var(--info-bg);color:var(--info)}
.net-done{background:var(--verde-bg);color:var(--verde-txt)}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#view{padding:1rem 1rem 7rem;max-width:1240px;width:100%;margin:0 auto;outline:none}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--cartao);border-top:1px solid var(--borda-2);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--texto-2);background:none;border:0;position:relative;padding:.25rem 0}
.nav-btn .nav-ic{display:grid;place-items:center;width:3.2rem;height:2rem;border-radius:999px}
.nav-btn[aria-current="page"]{color:var(--verde-txt)}
.nav-btn[aria-current="page"] .nav-ic{background:var(--verde-bg);outline:2px solid var(--verde)}
.nav-btn .dot{position:absolute;top:6px;left:calc(50% + .6rem);background:var(--critico);color:#fff;border-radius:999px;font-size:.7rem;min-width:1.2rem;height:1.2rem;display:grid;place-items:center;padding:0 .25rem}

/* ---------- Componentes ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem;margin:.25rem 0 1rem}
.page-head h1{font-size:1.5rem;display:flex;align-items:center;gap:.5rem}
.page-head .lead{color:var(--texto-2);margin-top:.2rem;max-width:60ch}
.section{margin-top:1.4rem}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
.section-h h2{font-size:1.15rem;display:flex;align-items:center;gap:.45rem}
.card{background:var(--cartao);border:1px solid var(--borda);border-radius:var(--raio);padding:1rem}
.card-btn{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.card-btn:hover{border-color:var(--borda-2);background:#FFFDF7}
.sev-crit{border-left:7px solid var(--critico)}
.sev-warn{border-left:7px solid var(--atencao-ic)}
.sev-info{border-left:7px solid var(--info)}
.sev-ok{border-left:7px solid var(--verde-claro)}
.muted{color:var(--texto-2)}
.small{font-size:.9rem}
.row{display:flex;align-items:center;gap:.6rem}
.row-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.spread{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.stack{display:grid;gap:.6rem}
.grid2,.grid3{display:grid;gap:.75rem}
@media (min-width:680px){.grid2,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1150px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}

.btn{min-height:52px;padding:.65rem 1.15rem;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:2px solid transparent;text-decoration:none;line-height:1.2;text-align:center}
.btn-primary{background:var(--verde);color:#fff}
.btn-primary:hover{background:var(--verde-2)}
.btn-secondary{background:var(--cartao);color:var(--verde-txt);border-color:var(--verde)}
.btn-secondary:hover{background:var(--verde-bg)}
.btn-ghost{background:transparent;color:var(--verde-txt);border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:var(--critico);color:#fff}
.btn-danger-soft{background:var(--cartao);color:var(--critico);border-color:var(--critico)}
.btn-block{width:100%}
.btn-sm{min-height:46px;padding:.45rem .85rem;font-size:.95rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--borda-2);background:var(--cartao);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;color:var(--verde-txt);font-weight:700;padding:0 .6rem}

.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:999px;font-size:.85rem;font-weight:700;line-height:1.35;white-space:nowrap}
.pill .ic{width:1.1em;height:1.1em}
.pill-ok{background:var(--verde-bg);color:var(--verde-txt)}
.pill-warn{background:var(--atencao-bg);color:var(--atencao)}
.pill-crit{background:var(--critico-bg);color:var(--critico)}
.pill-info{background:var(--info-bg);color:var(--info)}
.pill-neutral{background:var(--cartao-2);color:var(--texto-2);border:1px solid var(--borda)}

.tabs{display:flex;gap:.45rem;overflow-x:auto;padding:.15rem .1rem .4rem;margin-bottom:.9rem;scrollbar-width:thin}
.tab{min-height:50px;padding:.45rem 1rem;border-radius:999px;border:2px solid var(--borda-2);background:var(--cartao);font-weight:700;white-space:nowrap;display:inline-flex;gap:.4rem;align-items:center;color:var(--texto)}
.tab[aria-selected="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}
.tab .count{background:rgba(0,0,0,.08);border-radius:999px;padding:0 .45rem;font-size:.85rem}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.22)}

.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-height:50px;padding:.45rem .9rem;border:2px solid var(--borda-2);border-radius:12px;background:var(--cartao);font-weight:700;display:inline-flex;gap:.45rem;align-items:center;text-align:left;color:var(--texto)}
.chip .ck{display:none}
.chip[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-txt);box-shadow:inset 0 0 0 1px var(--verde)}
.chip[aria-pressed="true"] .ck{display:inline-flex}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.chip .emo{font-size:1.25rem}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.2rem,1fr));gap:.55rem}
.opt{min-height:80px;padding:.6rem;border:2px solid var(--borda-2);border-radius:14px;background:var(--cartao);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.15rem;font-weight:700;text-align:left;position:relative;color:var(--texto)}
.opt .emo{font-size:1.6rem;line-height:1}
.opt .sub{font-weight:400;font-size:.85rem;color:var(--texto-2)}
.opt .ck{position:absolute;top:.4rem;right:.4rem;display:none;background:var(--verde);color:#fff;border-radius:999px;padding:.1rem}
.opt[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-bg);box-shadow:inset 0 0 0 1px var(--verde)}
.opt[aria-pressed="true"] .ck{display:inline-flex}
.opt .ic-big{width:1.9rem;height:1.9rem}

.field{margin-bottom:1.35rem}
.field>label,.flabel{font-weight:700;display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem;font-size:1.02rem}
.qn{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:999px;background:var(--verde);color:#fff;font-size:.85rem;flex:none}
.opt-tag{font-weight:400;color:var(--texto-2);font-size:.9rem}
input[type=text],input[type=tel],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;min-height:54px;padding:.6rem .85rem;border:2px solid var(--borda-2);border-radius:12px;background:#FFFEFA;color:var(--texto)}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:#7A7766}
[aria-invalid="true"]{border-color:var(--critico)!important;background:#FFF6F4!important}
.hint{font-size:.9rem;color:var(--texto-2);margin-top:.35rem}
.err{color:var(--critico);font-weight:700;display:flex;gap:.4rem;align-items:flex-start;margin-top:.45rem;font-size:.95rem}
.err[hidden]{display:none}
.help-btn{min-width:44px;min-height:44px;border-radius:999px;border:2px solid var(--borda-2);background:var(--cartao);color:var(--info);display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-left:auto;gap:.25rem;padding:0 .5rem;font-size:.85rem}
.help{background:var(--info-bg);color:#0F3B57;border-radius:10px;padding:.6rem .8rem;margin:.2rem 0 .6rem;font-size:.95rem}
.stepper{display:flex;align-items:stretch;gap:.45rem}
.stepper button{width:58px;min-height:58px;border-radius:12px;border:2px solid var(--verde);background:var(--cartao);color:var(--verde-txt);display:grid;place-items:center;flex:none}
.stepper input{text-align:center;font-size:1.35rem;font-weight:700;min-width:0;flex:1}
.stepper .unit{align-self:center;font-weight:700;min-width:3.5rem}
.switch-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--borda)}
.switch-row:last-child{border-bottom:0}
.switch-row .txt{flex:1}
.switch{min-width:7.2rem;min-height:48px;border-radius:999px;border:2px solid var(--borda-2);background:var(--cartao-2);display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem .25rem .3rem;font-weight:700;color:var(--texto-2)}
.switch .knob{width:2.1rem;height:2.1rem;border-radius:999px;background:#fff;border:2px solid var(--borda-2);display:grid;place-items:center}
.switch[aria-checked="true"]{background:var(--verde);border-color:var(--verde);color:#fff;flex-direction:row-reverse;padding:.25rem .3rem .25rem .7rem}
.switch[aria-checked="true"] .knob{border-color:#fff;color:var(--verde)}
.switch[disabled]{opacity:.7;cursor:not-allowed}
.check-row{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .8rem;border:2px solid var(--borda-2);border-radius:12px;background:var(--cartao);cursor:pointer}
.check-row input{width:1.5rem;height:1.5rem;margin-top:.1rem;accent-color:var(--verde);flex:none}

.review{background:var(--cartao-2);border:2px dashed var(--borda-2);border-radius:14px;padding:.85rem 1rem}
.review.warn{background:var(--atencao-bg);border-color:var(--atencao-ic);color:var(--atencao)}
.review h3{font-size:1rem;margin-bottom:.3rem;display:flex;gap:.4rem;align-items:center}
.saldo{display:flex;align-items:center;gap:.5rem;font-size:1.3rem;font-weight:700;flex-wrap:wrap}

/* listas e cartões */
.emo-box{width:3.1rem;height:3.1rem;display:grid;place-items:center;background:var(--cartao-2);border-radius:12px;font-size:1.65rem;flex:none}
.qty{font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.qty small{font-size:1rem;font-weight:700;color:var(--texto-2)}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--foco)}100%{box-shadow:0 0 0 0 transparent}}
.list-row{display:flex;gap:.75rem;align-items:center;padding:.75rem .9rem;border-bottom:1px solid var(--borda);background:var(--cartao);width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:inherit}
.list-row:last-child{border-bottom:0}
button.list-row:hover{background:#FFFDF7}
.list-box{border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;background:var(--cartao)}
.when{min-width:5.2rem;font-weight:700;font-size:.9rem;color:var(--texto-2)}
.av{width:2.6rem;height:2.6rem;border-radius:999px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:.95rem}
.av-sm{width:2rem;height:2rem;font-size:.8rem}
.empty{text-align:center;padding:1.5rem 1rem;color:var(--texto-2)}
.group-h{font-weight:700;color:var(--texto-2);margin:1rem 0 .4rem;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}

/* Início */
.hello h1{font-size:1.45rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
.tile{display:flex;flex-direction:column;gap:.25rem;min-height:128px}
.tile-top{display:flex;align-items:center;gap:.4rem;font-weight:700;color:var(--texto-2)}
.tile-big{font-size:1.45rem;font-weight:700;line-height:1.15}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.quick .btn{min-height:68px;justify-content:flex-start;text-align:left}
.wx{background:var(--info-bg);border:1px solid var(--info-borda);color:#0E3550}
.wx-temp{font-size:2.6rem;font-weight:700;line-height:1}
.wx-days{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.75rem}
.wx-day{background:rgba(255,255,255,.6);border-radius:10px;padding:.45rem;text-align:center;font-size:.9rem}
.wx-src{font-size:.85rem;margin-top:.6rem;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.alert-banner{display:flex;gap:.75rem;align-items:flex-start}
.alert-banner .ic-wrap{width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;flex:none}
.crit-ic{background:var(--critico-bg);color:var(--critico)}
.warn-ic{background:var(--atencao-bg);color:var(--atencao)}
.info-ic{background:var(--info-bg);color:var(--info)}
.ok-ic{background:var(--verde-bg);color:var(--verde-txt)}

/* gráfico de barras */
.bars{display:grid;gap:.8rem}
.bar-top{display:flex;justify-content:space-between;gap:.5rem;font-weight:700;align-items:center}
.bar-track{height:1.6rem;background:var(--cartao-2);border:1px solid var(--borda);border-radius:8px;overflow:hidden;margin-top:.25rem}
.bar-fill{height:100%;background:var(--terra);border-radius:7px 0 0 7px;min-width:4px}
.bar-fill.top{background:repeating-linear-gradient(135deg,var(--terra) 0 10px,#6E4520 10px 20px)}

/* calendário */
.days{display:flex;gap:.45rem;overflow-x:auto;padding:.2rem .1rem .5rem}
.day{min-width:4.3rem;min-height:6rem;border:2px solid var(--borda);border-radius:14px;background:var(--cartao);display:flex;flex-direction:column;align-items:center;padding:.35rem .25rem;font-weight:700;gap:.1rem;color:var(--texto)}
.day .wd{font-size:.8rem;color:var(--texto-2);text-transform:capitalize}
.day .dn{font-size:1.25rem}
.day .mk{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;color:var(--verde-txt)}
.day .mk .ic{width:1rem;height:1rem}
.day.today{border-color:var(--verde)}
.day.today .wd{color:var(--verde-txt)}
.day.rain{background:linear-gradient(var(--info-bg),var(--cartao) 60%)}
.day[aria-pressed="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .mk{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.9rem;color:var(--texto-2);margin:.2rem 0 .4rem}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend .ic{width:1.1rem;height:1.1rem}
.progress{height:.6rem;background:var(--cartao-2);border-radius:999px;overflow:hidden;border:1px solid var(--borda)}
.progress>div{height:100%;background:var(--verde-claro)}

/* riscos */
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;margin-top:.3rem}
.meter div{border:2px solid var(--borda-2);border-radius:10px;padding:.35rem;text-align:center;font-weight:700;font-size:.9rem;color:var(--texto-2);background:var(--cartao)}
.meter .on-baixo{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.meter .on-medio{background:var(--atencao-bg);border-color:var(--atencao-ic);color:var(--atencao)}
.meter .on-alto{background:var(--critico-bg);border-color:var(--critico);color:var(--critico)}
.dl{display:grid;gap:.9rem}
.dl h3{font-size:.95rem;color:var(--texto-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.2rem;display:flex;gap:.4rem;align-items:center}
.todo{margin:0;padding:0;list-style:none;display:grid;gap:.45rem}
.todo li{display:flex;gap:.5rem;align-items:flex-start;background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:.55rem .7rem}
.todo li .ic{color:var(--verde-txt);margin-top:.1rem}

/* sheets e diálogos */
.overlay{position:fixed;inset:0;background:rgba(18,28,14,.5);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--creme);width:100%;height:100%;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:.35rem;padding:.35rem .6rem;background:var(--verde);color:#fff;min-height:62px}
.sheet-head h2{font-size:1.15rem;flex:1;min-width:0}
.sheet-head .top-btn{flex-direction:row;gap:.35rem;font-size:.95rem;padding:0 .6rem}
.sheet-body{flex:1;overflow:auto;padding:1.1rem 1rem 2rem}
.sheet-body>.inner{max-width:640px;margin:0 auto}
.sheet-foot{padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));background:var(--cartao);border-top:1px solid var(--borda-2);display:flex;gap:.6rem}
.sheet-foot .btn-primary{flex:1}
.dialog-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(18,28,14,.55);padding:1rem}
.dialog{background:var(--cartao);border-radius:18px;max-width:460px;width:100%;padding:1.25rem;border:1px solid var(--borda-2);animation:up .18s ease-out}
.dialog h2{font-size:1.2rem;margin:.6rem 0 .4rem}
.dialog-actions{display:grid;gap:.55rem;margin-top:1.1rem}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:5.6rem;z-index:90;width:min(94vw,540px);display:grid;gap:.5rem}
.toast{display:flex;gap:.65rem;align-items:center;background:#18261A;color:#fff;padding:.8rem .9rem;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:up .2s ease-out}
.toast .tic{width:2.1rem;height:2.1rem;border-radius:999px;display:grid;place-items:center;flex:none}
.toast .t-ok{background:#CDE8C6;color:#174A22}.toast .t-warn{background:#FBE0A8;color:#6B3600}.toast .t-crit{background:#F6CFC9;color:#7E140B}.toast .t-info{background:#CFE3F2;color:#0B4468}
.toast .msg{flex:1}
.toast button{background:transparent;border:2px solid #fff;color:#fff;border-radius:10px;min-height:44px;padding:0 .7rem;font-weight:700}
.live-banner{position:fixed;top:.6rem;left:50%;transform:translateX(-50%);width:min(94vw,560px);z-index:85;background:var(--cartao);border:2px solid var(--critico);border-radius:16px;padding:.85rem;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease-out}
.demo-fab{position:fixed;right:.75rem;bottom:5.4rem;z-index:40;border:2px dashed var(--terra);background:#FFF6E6;color:#5A3A16;border-radius:999px;min-height:48px;padding:0 .9rem;font-weight:700;display:inline-flex;gap:.4rem;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.demo-note{background:#FFF6E6;border:2px dashed var(--terra);color:#5A3A16;border-radius:12px;padding:.7rem .85rem;font-size:.95rem}
.photo-prev{max-width:220px;border-radius:12px;border:1px solid var(--borda);display:block}
.mapbox{border:2px solid var(--borda-2);border-radius:14px;overflow:hidden;background:#E9E3CF;cursor:crosshair;touch-action:manipulation}
.mapbox svg{display:block;width:100%;height:auto}
.otp{display:flex;gap:.6rem}
.otp input{width:3.6rem;height:4rem;text-align:center;font-size:1.8rem;font-weight:700;padding:0}
.steps-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin-top:.5rem}
.steps-bar div{height:.5rem;border-radius:999px;background:rgba(255,255,255,.3)}
.steps-bar div.done{background:#CDE8C6}
.steps-bar div.cur{background:var(--foco)}
#onb{position:fixed;inset:0;z-index:60;background:var(--creme);display:flex;flex-direction:column;overflow:auto}
#onb[hidden]{display:none}
.onb-head{background:var(--verde);color:#fff;padding:.8rem 1rem}
.onb-head .in,.onb-body .in,.onb-foot .in{max-width:560px;margin:0 auto}
.onb-body{flex:1;padding:1.2rem 1rem 2rem}
.onb-foot{position:sticky;bottom:0;background:var(--cartao);border-top:1px solid var(--borda-2);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom))}
.onb-foot .in{display:flex;gap:.6rem}
.onb-foot .btn-primary{flex:1}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:1.4rem;padding:2rem 1.25rem;max-width:520px;margin:0 auto}
.welcome .big-logo{width:84px;height:84px;border-radius:24px;background:var(--verde);color:#F4EEDF;display:grid;place-items:center}
.welcome h1{font-size:2rem}
.about h3{font-size:1.05rem;margin:1.2rem 0 .4rem}
.about table{border-collapse:collapse;width:100%;font-size:.92rem}
.about td,.about th{border-bottom:1px solid var(--borda);padding:.45rem .4rem;text-align:left;vertical-align:top}
.about th{background:var(--cartao-2)}
.about .tbl{overflow-x:auto;border:1px solid var(--borda);border-radius:12px;background:var(--cartao)}

/* ---------- Tablet e computador ---------- */
@media (min-width:680px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .quick{grid-template-columns:repeat(4,minmax(0,1fr))}
  .wx-days{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:960px){
  .sidebar{display:flex;flex-direction:column;width:272px;flex:none;background:var(--verde);color:#fff;position:sticky;top:0;height:100vh;padding:1rem .8rem;gap:.4rem;overflow:auto}
  .sidebar .brand{flex:none;margin:.2rem .3rem 1rem}
  .side-nav{display:grid;gap:.3rem}
  .side-btn{display:flex;align-items:center;gap:.75rem;min-height:56px;padding:.5rem .9rem;border-radius:12px;border:0;background:transparent;color:#fff;font-weight:700;font-size:1.05rem;text-align:left;position:relative}
  .side-btn:hover{background:rgba(255,255,255,.1)}
  .side-btn[aria-current="page"]{background:#F4EEDF;color:var(--verde)}
  .side-btn .dot{margin-left:auto;background:var(--critico);color:#fff;border-radius:999px;font-size:.75rem;min-width:1.4rem;height:1.4rem;display:grid;place-items:center;padding:0 .3rem}
  .side-foot{margin-top:auto;display:grid;gap:.5rem}
  .side-card{background:rgba(255,255,255,.1);border-radius:12px;padding:.7rem .8rem;font-size:.92rem}
  .bottomnav{display:none}
  .topbar{background:var(--creme);color:var(--texto);border-bottom:1px solid var(--borda)}
  .topbar .brand{display:none}
  .page-title-top{display:block;flex:1;font-weight:700;font-size:1.05rem;color:var(--texto-2)}
  .top-btn{color:var(--verde-txt)}
  .top-btn:hover{background:var(--verde-bg)}
  .badge{border-color:var(--creme)}
  #view{padding:1.5rem 2rem 3rem}
  .sheet{width:560px;height:100%;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  #toasts{bottom:1.5rem}
  .demo-fab{bottom:1.2rem;right:1.2rem}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1.4rem;align-items:start}
  .home-grid .section:first-child{margin-top:0}
  .page-head h1{font-size:1.75rem}
}
.hide-sm{display:none}
@media (min-width:680px){.hide-sm{display:block}}
/* ajustes de leitura em telas estreitas */
.wx-days{grid-template-columns:repeat(3,minmax(0,1fr))}
.wx-day .pill{font-size:.78rem;padding:.1rem .35rem;overflow-wrap:anywhere;justify-content:center}
@media (min-width:680px){.wx-days{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tabs{flex-wrap:wrap;overflow:visible}
.tile .pill,.wx-day .pill,.list-row .pill{white-space:normal}
.wx-temp{white-space:nowrap}
.wx>.spread{flex-wrap:wrap}
.wx>.spread>div:last-child{text-align:left!important}
.wx>.spread>div:last-child .row{justify-content:flex-start!important}
.tile .pill{border-radius:10px}
.brand-name{white-space:nowrap}
.tile-big{overflow-wrap:anywhere}
.quick .btn{flex-direction:column;justify-content:center;text-align:center;gap:.3rem;padding:.6rem .5rem;min-height:84px}
@media (max-width:679px){
  .list-row{flex-wrap:wrap;row-gap:.2rem}
  .list-row>.when{flex-basis:100%;min-width:0;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
}
@media (min-width:680px){.tiles{grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr))}}
@media (min-width:960px){
  .home-grid{margin-top:1.4rem}
  .home-grid .wx-days{grid-template-columns:repeat(3,minmax(0,1fr))}
  .home-grid .hide-sm{display:none}
  .home-grid .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-grid .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const n = diffDays(s);
  if (n === 0) return "Hoje";
  if (n === 1) return "Amanhã";
  if (n === -1) return "Ontem";
  return cap(wd(s)) + ", " + ddmm(s);

  if (l.prev && diffDays(l.prev) <= 1) return { k: "pronto", txt: diffDays(l.prev) < 0 ? "Colheita atrasada" : "Pronto para colher", ic: "basket", cls: "pill-warn" };
  return { k: "crescendo", txt: "Crescendo", ic: "sprout", cls: "pill-info" };
}

const NIVEL = {
  alto: { txt: "Risco alto", ic: "warn", cls: "pill-crit", sev: "sev-crit", box: "crit-ic" },
  medio: { txt: "Risco médio", ic: "warn", cls: "pill-warn", sev: "sev-warn", box: "warn-ic" },

};
const TIPO_PREF = { tempestade: "tempestade", chuva: "chuva", enchente: "enchente", mudanca: "mudanca", calor: "calor", defensivo: "defensivo", estoque: "estoque" };
const alertsOn = () => S.alerts.filter(a => S.prefs[TIPO_PREF[a.tipo]] !== false && !a.resolvido);
const NIVEL_ORD = { alto: 0, medio: 1, baixo: 2 };
const sortAlerts = arr => arr.slice().sort((a, b) => NIVEL_ORD[a.nivel] - NIVEL_ORD[b.nivel] || a.quando.localeCompare(b.quando));

function lossKg(l) { const it = item(l.itemId); return l.qtd * (it ? it.kgU : 1); }
const PER = { semana: 7, mes: 30, trimestre: 90 };
const PER_TXT = { semana: "últimos 7 dias", mes: "últimos 30 dias", trimestre: "últimos 3 meses" };
const lossesIn = days => S.losses.filter(l => diffDays(l.data) > -days && diffDays(l.data) <= 0);

const myTasks = () => isG() ? S.tasks : S.tasks.filter(t => t.resp === S.me);
const openTasks = arr => arr.filter(t => t.status !== "concluida");
const isLate = t => t.status !== "concluida" && diffDays(t.prazo) < 0;
const TASK_ST = {
  pendente: { txt: "Pendente", ic: "circle", cls: "pill-warn" },
  andamento: { txt: "Em andamento", ic: "half", cls: "pill-info" },
  concluida: { txt: "Concluída", ic: "checkCircle", cls: "pill-ok" }
};

const pendCount = () => ["movs", "losses", "ships", "tasks", "lots", "items"].reduce((n, k) => n + S[k].filter(r => r.pend).length, 0) + S.alerts.reduce((n, a) => n + a.acoes.filter(x => x.pend).length, 0);
const syncTag = r => r && r.pend ? `<span class="pill pill-info">${icon("cloudUp")}Guardado no celular</span>` : "";

function log(txt, ic) { S.log.unshift({ t: Date.now(), quem: S.me, ic: ic || "note", txt }); }
function notify(para, texto, ir) { S.notifs.unshift({ id: uid("n"), para, texto, t: Date.now(), lido: false, ir }); }
function stamp(rec) { if (!U.online) rec.pend = true; return rec; }
</script>
<script>
/* =========================================================
   ESTRUTURA: navegação, cabeçalho, conexão, avisos rápidos
   ========================================================= */
const AREAS = [
  { k: "inicio", t: "Início", ic: "home", d: "Visão geral do sítio" },
  { k: "producao", t: "Produção", ic: "sprout", d: "Plantio, colheita, perdas e transporte" },
  { k: "estoque", t: "Estoque", ic: "box", d: "Produtos e insumos guardados" },
  { k: "alertas", t: "Alertas", ic: "cloudBolt", d: "Clima e avisos" },
  { k: "familia", t: "Família", ic: "users", d: "Pessoas e tarefas" }
];

function navBadge(k) {
  if (k === "alertas") { const n = alertsOn().filter(a => !a.lido).length; return n ? n : ""; }
  if (k === "familia") { const n = openTasks(S.tasks.filter(t => t.resp === S.me)).length; return n ? n : ""; }
  return "";
}
function bellCount() {
  return alertsOn().filter(a => !a.lido).length + S.notifs.filter(n => n.para === S.me && !n.lido).length;
}

function renderShell() {
  document.documentElement.dataset.font = S.ui.font;
  document.body.classList.toggle("sol", !!S.ui.sol);
  const cur = U.route;
  $("#bottomnav").innerHTML = AREAS.map(a => {
    const b = navBadge(a.k);
    return `<button class="nav-btn" type="button" data-action="go" data-to="${a.k}" ${cur === a.k ? 'aria-current="page"' : ""}>
      <span class="nav-ic">${icon(a.ic)}</span>${a.t}${b ? `<span class="dot" aria-label="${b} novos">${b}</span>` : ""}</button>`;
  }).join("");
  const m = me();
  $("#sidebar").innerHTML = `
    <div class="brand"><span class="logo">${icon("leaf", "ic-lg")}</span><div><div class="brand-name">Campo Claro</div><div class="brand-prop">${esc(S.prop.nome)}</div></div></div>
    <nav class="side-nav">${AREAS.map(a => { const b = navBadge(a.k); return `<button class="side-btn" type="button" data-action="go" data-to="${a.k}" ${cur === a.k ? 'aria-current="page"' : ""}>${icon(a.ic)}<span>${a.t}</span>${b ? `<span class="dot" aria-label="${b} novos">${b}</span>` : ""}</button>`; }).join("")}</nav>
    <div class="side-foot">
      <div class="side-card"><div class="row">${avatar(m, true)}<div><strong>${esc(m.nome)}</strong><br>${m.papel === "gestor" ? "Gestor" : "Membro"} · ${esc(m.vinculo)}</div></div></div>
      <div class="side-card">${icon("pin")} ${esc(S.prop.municipio)}</div>
    </div>`;
  const area = AREAS.find(a => a.k === cur);
  const bc = bellCount();
  $("#topbar").innerHTML = `<div class="topbar-in">
      <div class="brand"><span class="logo">${icon("leaf", "ic-lg")}</span><div style="min-width:0"><div class="brand-name">Campo Claro</div><div class="brand-prop">${esc(S.prop.nome)}</div></div></div>
      <div class="page-title-top">${area ? area.t + " · " + esc(S.prop.nome) : ""}</div>
      <button class="top-btn" type="button" data-action="letra" aria-label="Tamanho da letra">${icon("type")}<span>Letra</span></button>
      <button class="top-btn" type="button" data-action="bell" aria-label="Avisos: ${bc} novos">${icon("bell")}<span>Avisos</span>${bc ? `<span class="badge">${bc}</span>` : ""}</button>
      <button class="top-btn" type="button" data-action="perfil" aria-label="Perfil e configurações">${icon("user")}<span>${esc(m.curto)}</span></button>
    </div>`;
  $("#demoFab").innerHTML = `${icon("sliders")}Protótipo`;
  renderNet();
}

function renderNet() {
  const n = pendCount();
  const map = {
    online: ["net-online", "wifi", n ? `Conectado · enviando ${n} ${plural(n, "registro", "registros")}` : "Conectado · tudo salvo"],
    offline: ["net-offline", "wifiOff", n ? `Sem internet · ${n} ${plural(n, "registro guardado", "registros guardados")} no celular. Será enviado quando a internet voltar.` : "Sem internet · pode continuar usando. Tudo fica guardado no celular."],
    sync: ["net-sync", "sync", `Sincronizando ${n} ${plural(n, "registro", "registros")}…`],
    done: ["net-done", "checkCircle", "Sincronização concluída · tudo salvo"]
  };
  const [cls, ic, txt] = map[U.net];
  const el = $("#netbar");
  el.className = "netbar " + cls;
  el.innerHTML = `<div class="in">${icon(ic, U.net === "sync" ? "spin" : "")}<span>${txt}</span></div>`;
}

/* conexão real + simulada */
function goOffline(silent) {
  U.online = false; U.net = "offline"; renderNet();
  if (!silent) toast("Sem internet. Pode continuar usando: seus registros ficam guardados no celular.", "warn");
}
function goOnline() {
  U.online = true;
  const n = pendCount();
  if (!n) { U.net = "online"; renderNet(); toast("A internet voltou.", "ok"); return; }
  U.net = "sync"; renderNet();
  setTimeout(() => {
    ["movs", "losses", "ships", "tasks", "lots", "items"].forEach(k => S[k].forEach(r => delete r.pend));
    S.alerts.forEach(a => a.acoes.forEach(x => delete x.pend));
    save(); U.net = "done"; render();
    toast(`${n} ${plural(n, "registro enviado", "registros enviados")}. Sincronização concluída.`, "ok");
    setTimeout(() => { if (U.net === "done") { U.net = "online"; renderNet(); } }, 4000);
  }, 2200);
}
window.addEventListener("online", goOnline);
window.addEventListener("offline", () => goOffline());

/* ---------- avisos rápidos (toasts) ---------- */
const T_IC = { ok: "checkCircle", warn: "warn", crit: "xCircle", info: "info" };
function toast(msg, kind = "ok", undo) {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", kind === "crit" ? "alert" : "status");
  el.innerHTML = `<span class="tic t-${kind}">${icon(T_IC[kind])}</span><span class="msg">${msg}</span>${undo ? '<button type="button">Desfazer</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { el.remove(); undo(); };
  box.appendChild(el);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => el.remove(), undo ? 7000 : 5000);
}
function vibrate(p) { try { if (S.prefs.vibrar && navigator.vibrate) navigator.vibrate(p || [180, 80, 180]); } catch (e) {} }
function snap() { return JSON.stringify(S); }
function restore(sn) { S = JSON.parse(sn); save(); closeAll(); render(); toast("Pronto. A ação foi desfeita.", "info"); }

/* ---------- painéis (sheets) e diálogos ---------- */
const layers = [];
function openSheet({ title, body, foot, onMount, back = "Voltar", wide }) {
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  const id = uid("sh");
  wrap.innerHTML = `<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="${id}">
    <div class="sheet-head"><button class="top-btn" type="button" data-close>${icon("back")}<span>${back}</span></button><h2 id="${id}">${title}</h2></div>
    <div class="sheet-body"><div class="inner">${body}</div></div>
    ${foot ? `<div class="sheet-foot">${foot}</div>` : ""}</section>`;
  wrap.addEventListener("click", e => { if (e.target === wrap || e.target.closest("[data-close]")) closeTop(); });
  $("#layers").appendChild(wrap);
  const L = { el: wrap, kind: "sheet", prevFocus: document.activeElement };
  layers.push(L);
  if (onMount) onMount(wrap.querySelector(".sheet"), L);
  setTimeout(() => { const f = wrap.querySelector(".sheet-head [data-close]"); f && f.focus(); }, 30);
  return wrap.querySelector(".sheet");
}
function closeTop() {
  const L = layers.pop(); if (!L) return;
  L.el.remove();
  if (L.onClose) L.onClose();
  if (L.prevFocus && document.contains(L.prevFocus)) try { L.prevFocus.focus(); } catch (e) {}
}
function closeAll() { while (layers.length) { const L = layers.pop(); L.el.remove(); } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && layers.length) closeTop(); });

function dialog({ ic = "warn", tone = "warn", title, msg, buttons }) {
  return new Promise(res => {
    const wrap = document.createElement("div");
    wrap.className = "dialog-wrap";
    const id = uid("dg");
    wrap.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="${id}">
      <span class="alert-banner"><span class="ic-wrap ${tone}-ic">${icon(ic)}</span></span>
      <h2 id="${id}">${title}</h2><p>${msg}</p>
      <div class="dialog-actions">${buttons.map((b, i) => `<button type="button" class="btn ${b.cls || "btn-secondary"} btn-block" data-i="${i}">${b.ic ? icon(b.ic) : ""}${b.t}</button>`).join("")}</div></div>`;
    wrap.addEventListener("click", e => {
      const b = e.target.closest("[data-i]");
      if (b) { wrap.remove(); layers.splice(layers.indexOf(L), 1); res(buttons[+b.dataset.i].v); }
    });
    $("#layers").appendChild(wrap);
    const L = { el: wrap, kind: "dialog", onClose: () => res(null) };
    layers.push(L);
    setTimeout(() => wrap.querySelector("[data-i]").focus(), 30);
  });
}
const confirmDel = (title, msg, t = "Sim, excluir") => dialog({ ic: "trash", tone: "crit", title, msg, buttons: [{ t, v: true, cls: "btn-danger", ic: "trash" }, { t: "Não, manter", v: false, cls: "btn-secondary" }] });

/* ---------- pequenos construtores de formulário ---------- */
function chipBtn(val, label, on, extra = "") { return `<button type="button" class="chip" data-v="${esc(val)}" aria-pressed="${on ? "true" : "false"}" ${extra}><span class="ck">${icon("check")}</span>${label}</button>`; }
function optBtn(val, main, sub, on, lead = "") { return `<button type="button" class="opt" data-v="${esc(val)}" aria-pressed="${on ? "true" : "false"}"><span class="ck">${icon("check")}</span>${lead}<span>${main}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</button>`; }
function stepper(id, val, unit, label) {
  return `<div class="stepper"><button type="button" data-step="-1" data-for="${id}" aria-label="Diminuir ${label}">${icon("minus")}</button>
    <input id="${id}" type="text" inputmode="decimal" autocomplete="off" value="${val === "" || val == null ? "" : fmtN(val)}" aria-describedby="${id}-err ${id}-hint">
    <button type="button" data-step="1" data-for="${id}" aria-label="Aumentar ${label}">${icon("plus")}</button><span class="unit" id="${id}-un">${esc(unit || "")}</span></div>`;
}
function errBox(id) { return `<p class="err" id="${id}-err" hidden></p>`; }
function setErr(root, id, msg) {
  const e = root.querySelector("#" + id + "-err"); const inp = root.querySelector("#" + id);
  if (e) { e.hidden = !msg; e.innerHTML = msg ? icon("warn") + "<span>" + msg + "</span>" : ""; }
  if (inp) inp.setAttribute("aria-invalid", msg ? "true" : "false");
  return !msg;
}
function helpToggle(id, text) {
  return { btn: `<button type="button" class="help-btn" data-help="${id}" aria-expanded="false" aria-controls="${id}">${icon("help")}Ajuda</button>`, box: `<p class="help" id="${id}" hidden>${text}</p>` };
}
/* ligações comuns dentro de um formulário: chips de escolha única/múltipla, stepper, ajuda */
function wireForm(root, F, onChange) {
  root.addEventListener("click", e => {
    const h = e.target.closest("[data-help]");
    if (h) { const box = root.querySelector("#" + h.dataset.help); box.hidden = !box.hidden; h.setAttribute("aria-expanded", String(!box.hidden)); return; }
    const st = e.target.closest("[data-step]");
    if (st) {
      const inp = root.querySelector("#" + st.dataset.for);
      let v = parseN(inp.value); if (isNaN(v)) v = 0;
      v = Math.max(0, v + Number(st.dataset.step));
      inp.value = fmtN(v); inp.dispatchEvent(new Event("input", { bubbles: true })); return;
    }
    const c = e.target.closest("[data-v]");
    if (!c || c.disabled) return;
    const grp = c.closest("[data-group]");
    if (!grp) return;
    const name = grp.dataset.group, multi = grp.dataset.multi === "1";
    if (multi) {
      const on = c.getAttribute("aria-pressed") !== "true";
      c.setAttribute("aria-pressed", String(on));
      F[name] = $$("[data-v][aria-pressed=true]", grp).map(x => x.dataset.v);
    } else {
      $$("[data-v]", grp).forEach(x => x.setAttribute("aria-pressed", "false"));
      c.setAttribute("aria-pressed", "true");
      F[name] = c.dataset.v;
    }
    const er = root.querySelector("#" + name + "-err"); if (er) { er.hidden = true; }
    onChange && onChange(name, c);
  });
  root.addEventListener("input", e => { if (e.target.id) { setErr(root, e.target.id, ""); onChange && onChange(e.target.id, e.target); } });
}
function dateChips(name, val, opts = [[0, "Hoje"], [-1, "Ontem"]]) {
  const known = opts.map(o => D(o[0]));
  const other = val && !known.includes(val);
  return `<div class="chips" data-group="${name}">${opts.map(([o, t]) => chipBtn(D(o), t + ` <span class="muted small">(${ddmm(D(o))})</span>`, val === D(o))).join("")}${chipBtn("outra", "Outra data", other)}</div>
  <div id="${name}-other" ${other ? "" : "hidden"} style="margin-top:.5rem"><label class="sr" for="${name}-date">Escolha a data</label><input type="date" id="${name}-date" value="${other ? val : D(0)}"></div>`;
}
function readDate(root, F, name) { if (F[name] === "outra") { const v = root.querySelector("#" + name + "-date").value; return v || null; } return F[name] || null; }
function showOther(root, name, F) { const o = root.querySelector("#" + name + "-other"); if (o) o.hidden = F[name] !== "outra"; }

<script>

   TELAS PRINCIPAIS

/* ---------------- INÍCIO ---------------- */
function vInicio() {
  const m = me(), h = new Date().getHours();
  const saud = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";

    <div class="tiles">
      ${tile("producao", "lotes", "sprout", "Produção", `${ativos.length} ${plural(ativos.length, "lote", "lotes")}`, prontos.length ? `<span class="pill pill-warn">${icon("basket")}${prontos.length} pronto para colher</span>` : `<span class="pill pill-ok">${icon("checkCircle")}Tudo crescendo</span>`)}
      ${tile("estoque", "produtos", "box", "Estoque", atn.length ? `${atn.length} ${plural(atn.length, "item", "itens")}` : "Tudo certo", atn.length ? `<span class="pill ${insuf ? "pill-crit" : "pill-warn"}">${icon(insuf ? "xCircle" : "warn")}${plural(atn.length, "precisa", "precisam")} de atenção</span>` : `<span class="pill pill-ok">${icon("checkCircle")}Estoque disponível</span>`)}
      ${tile("producao", "perdas", "trendDown", "Perdas", `≈ ${fmtN(lwKg)} kg`, `<span class="muted">${lw.length} ${plural(lw.length, "registro", "registros")} nos últimos 7 dias</span>`)}
      ${tile("familia", "tarefas", "list", isG() ? "Tarefas" : "Suas tarefas", `${op.length} ${plural(op.length, "aberta", "abertas")}`, late.length ? `<span class="pill pill-crit">${icon("clock")}${late.length} ${plural(late.length, "atrasada", "atrasadas")}</span>` : `<span class="pill pill-ok">${icon("checkCircle")}Nenhuma atrasada</span>`)}
    </div></section>`;

  const clima = `<section class="section" aria-labelledby="h-clima"><div class="section-h"><h2 id="h-clima">${icon("cloudSun")}Clima no sítio</h2><button class="btn btn-ghost btn-sm" type="button" data-action="go" data-to="alertas" data-tab="previsao">Ver previsão</button></div>
    <div class="card wx">
      <div class="spread"><div class="row">${icon(w.ic, "ic-lg")}<div><div class="wx-temp num">${w.temp} °C</div><div><strong>${w.cond}</strong></div></div></div>
      <div style="text-align:right"><div class="row" style="justify-content:flex-end">${icon("drop")}<strong>Chuva hoje: ${dias[0].chuva}%</strong></div><div class="small">Umidade ${w.umid}% · Vento ${w.vento} km/h</div></div></div>
      <div class="wx-days">${dias.slice(1, 6).map((d, i) => `<div class="wx-day ${i > 2 ? "hide-sm" : ""}"><strong>${d.off === 1 ? "Amanhã" : cap(wd(d.data)).slice(0, 3)}</strong><br>${icon(d.ic)}<br><span class="num">${d.max}° / ${d.min}°</span><br>${icon("drop")} ${d.chuva}%${d.risco ? `<br><strong style="color:var(--atencao)">${icon("warn")}<span class="sr">${d.risco}</span></strong>` : ""}</div>`).join("")}</div>
      ${dias.filter(d => d.risco).length ? `<p class="review warn" style="margin-top:.6rem">${icon("warn")} ${dias.filter(d => d.risco).map(d => `<strong>${cap(wd(d.data))}:</strong> ${d.risco.toLowerCase()}`).join(" · ")}</p>` : ""}
      <p class="wx-src">${icon("clock")}${U.online ? "Atualizado" : "Sem internet · previsão salva"} ${fmtTs(S.wxAt).toLowerCase()} · ${WeatherService.fonte}</p>
    </div></section>`;

  const quick = `<section class="section" aria-labelledby="h-quick"><div class="section-h"><h2 id="h-quick">${icon("play")}Ações rápidas</h2></div>
    <div class="quick">
      <button class="btn btn-primary" type="button" data-action="mov">${icon("arrowOut")}Registrar movimentação</button>
      <button class="btn btn-secondary" type="button" data-action="perda">${icon("trendDown")}Registrar perda</button>
      <button class="btn btn-secondary" type="button" data-action="go" data-to="alertas" data-tab="previsao">${icon("cloudSun")}Consultar clima</button>

/* eventos do calendário (plantio, colheita, tarefas) */
const EV = {
  "plantio": { ic: "sprout", t: "Plantio feito" },
  "plantio-prev": { ic: "sprout", t: "Plantio previsto" },
  "colheita-prev": { ic: "basket", t: "Colheita prevista" },
  "colheita": { ic: "checkCircle", t: "Colheita feita" },
  "tarefa": { ic: "list", t: "Tarefa" },
  "clima": { ic: "cloudBolt", t: "Alerta de clima" }
};
function events() {
  const ev = [];
  S.lots.forEach(l => {
    const st = lotSt(l), base = { ref: l.id, refType: "lote", emo: l.emo };
    if (st.k === "planejado") ev.push({ ...base, date: l.plantio, kind: "plantio-prev", title: `Plantar ${l.nome}`, sub: `Lote ${l.code} · ${fmtN(l.qtd)} ${l.un}` });
    else ev.push({ ...base, date: l.plantio, kind: "plantio", title: `${l.cat === "Animal" ? "Chegada" : "Plantio"} de ${l.nome}`, sub: `Lote ${l.code} · ${fmtN(l.qtd)} ${l.un}` });
    if (l.colhido) ev.push({ ...base, date: l.colhido, kind: "colheita", title: `Colheita de ${l.nome}`, sub: `Lote ${l.code} · ${fmtN(l.colhidoQtd)} ${l.colhidoUn} colhidos` });
    else if (l.prev) ev.push({ ...base, date: l.prev, kind: "colheita-prev", title: `Colher ${l.nome}`, sub: `Lote ${l.code}${diffDays(l.prev) < 0 ? " · atrasada" : ""}` });
  });
  myTasks().filter(t => t.status !== "concluida").forEach(t => ev.push({ ref: t.id, refType: "tarefa", date: t.prazo, kind: "tarefa", title: t.nome, sub: `${person(t.resp).curto}${isLate(t) ? " · atrasada" : ""}` }));
  alertsOn().filter(a => a.nivel === "alto").forEach(a => ev.push({ ref: a.id, refType: "alerta", date: a.quando, kind: "clima", title: a.titulo, sub: a.hora }));
  return ev.sort((a, b) => a.date.localeCompare(b.date));
}
function activities() { return events().filter(e => e.kind !== "plantio" && e.kind !== "colheita" && diffDays(e.date) >= -3 && diffDays(e.date) <= 10 && !(e.kind === "colheita-prev" && diffDays(e.date) < -3)); }
function evRow(e) {
  const k = EV[e.kind];
  const late = diffDays(e.date) < 0 && ["tarefa", "colheita-prev"].includes(e.kind);
  return `<button type="button" class="list-row" data-action="${e.refType}" data-id="${e.ref}">
    <span class="when">${relDay(e.date)}</span>
    <span class="emo-box" style="width:2.6rem;height:2.6rem;font-size:1.3rem">${e.emo || icon(k.ic)}</span>
    <span style="flex:1;min-width:0"><strong>${esc(e.title)}</strong><br><span class="small muted">${icon(k.ic)} ${k.t} · ${esc(e.sub)}</span>
    ${late ? `<br><span class="pill pill-crit">${icon("clock")}Atrasada</span>` : e.kind === "clima" ? `<br><span class="pill pill-crit">${icon("warn")}Risco alto</span>` : ""}</span>${icon("chevron")}</button>`;
}

function vProducao() {
  const t = U.tabs.producao;
  const nLoss = lossesIn(PER[U.filtros.lossPer]).length;
  const head = pageHead("Produção", "sprout", "Plantio, colheita, perdas e saída dos produtos.");

  let body = "";
  if (t === "calendario") body = vCalendario();

function sugestoes() {
  const dias = WeatherService.dias();
  const pronto = S.lots.find(l => lotSt(l).k === "pronto");
  const chuvaForte = dias.find(d => d.mm >= 30);
  const bomPlantio = dias.filter(d => d.off >= 4 && d.chuva <= 30).slice(0, 2);
  return { pronto, chuvaForte, bomPlantio };
}
function vCalendario() {
  const f = U.filtros, sg = sugestoes();
  const all = events();
  const days = [];
  for (let o = -2; o <= 13; o++) days.push(D(o));
  const dias = WeatherService.dias();
  const dayBox = d => {
    const evs = all.filter(e => e.date === d);
    const kinds = [...new Set(evs.map(e => e.kind))];
    const wx = dias.find(x => x.data === d);
    const rain = wx && wx.chuva >= 60;
    return `<button type="button" class="day ${diffDays(d) === 0 ? "today" : ""} ${rain ? "rain" : ""}" data-action="calday" data-d="${d}" aria-pressed="${f.calDay === d}" aria-label="${relDay(d)}: ${evs.length} ${plural(evs.length, "atividade", "atividades")}${rain ? ", chuva prevista" : ""}">
      <span class="wd">${diffDays(d) === 0 ? "Hoje" : wd(d).slice(0, 3)}</span><span class="dn num">${parseD(d).getDate()}</span>
      <span class="mk">${kinds.map(k => icon(EV[k].ic)).join("")}${rain ? icon("rain") : ""}</span></button>`;
  };
  const kindsF = { tudo: null, plantio: ["plantio", "plantio-prev"], colheita: ["colheita", "colheita-prev"], tarefa: ["tarefa"] };
  let list = all.filter(e => !kindsF[f.calKind] || kindsF[f.calKind].includes(e.kind));
  let groups;
  if (f.calDay) {
    list = list.filter(e => e.date === f.calDay);
    groups = [[relDay(f.calDay), list]];
  } else {
    const g = (a, b) => list.filter(e => { const n = diffDays(e.date); return n >= a && n <= b; });
    const atras = list.filter(e => diffDays(e.date) < 0 && ["tarefa", "colheita-prev"].includes(e.kind));
    const feitos = list.filter(e => diffDays(e.date) < 0 && diffDays(e.date) >= -10 && ["plantio", "colheita"].includes(e.kind)).reverse();
    groups = [["Atrasado", atras], ["Hoje", g(0, 0)], ["Amanhã", g(1, 1)], ["Próximos 7 dias", g(2, 7)], ["Mais adiante (até 30 dias)", g(8, 30)], ["Feito nos últimos 10 dias", feitos]];
  }
  const filt = `<div class="chips" role="group" aria-label="Mostrar">${[["tudo", "Tudo", "layers"], ["plantio", "Plantios", "sprout"], ["colheita", "Colheitas", "basket"], ["tarefa", "Tarefas", "list"]].map(([k, t, ic]) => `<button type="button" class="chip" data-action="calkind" data-k="${k}" aria-pressed="${f.calKind === k}"><span class="ck">${icon("check")}</span>${icon(ic)}${t}</button>`).join("")}</div>`;
  return `
  <div class="card sev-info" style="margin-bottom:1rem"><div class="row" style="align-items:flex-start"><span class="ic-wrap info-ic" style="width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;flex:none">${icon("cloudSun")}</span>
    <div style="flex:1"><h2 style="font-size:1.05rem">Sugestão pelo clima</h2>
    <ul class="todo" style="margin-top:.5rem">
      ${sg.pronto && sg.chuvaForte ? `<li>${icon("basket")}<span><strong>Colher:</strong> ${esc(sg.pronto.nome)} (lote ${sg.pronto.code}) até ${relDay(D(sg.chuvaForte.off - 1)).toLowerCase()} cedo, antes da chuva forte de ${wd(sg.chuvaForte.data)}.</span></li>` : ""}
      ${sg.bomPlantio.length ? `<li>${icon("sprout")}<span><strong>Plantar:</strong> ${sg.bomPlantio.map(d => wd(d.data)).join(" ou ")}, com pouca chuva e terra úmida.</span></li>` : ""}
      <li>${icon("warn")}<span><strong>Evite:</strong> aplicar calda ou adubo de folha em dia de chuva.</span></li>
    </ul><button class="btn btn-ghost btn-sm" type="button" data-action="go" data-to="alertas" data-tab="previsao">Ver previsão completa</button></div></div></div>
  <div class="section-h"><h2>${icon("calendar")}Próximas duas semanas</h2><button class="btn btn-primary btn-sm" type="button" data-action="lote-novo">${icon("plus")}Cadastrar plantio</button></div>
  <div class="days" aria-label="Dias">${days.map(dayBox).join("")}</div>
  <div class="legend" aria-label="Legenda"><span>${icon("sprout")}Plantio</span><span>${icon("basket")}Colheita prevista</span><span>${icon("checkCircle")}Colheita feita</span><span>${icon("list")}Tarefa</span><span>${icon("rain")}Chuva (60% ou mais)</span></div>
  ${filt}
  ${f.calDay ? `<div class="row-wrap" style="margin-top:.75rem"><span class="pill pill-neutral">${icon("calendar")}Mostrando só: ${relDay(f.calDay)}</span><button class="btn btn-ghost btn-sm" type="button" data-action="calday" data-d="">Mostrar todos os dias</button></div>` : ""}
  ${groups.filter(([, l]) => l.length).map(([t, l]) => `<h3 class="group-h">${t}</h3><div class="list-box">${l.map(evRow).join("")}</div>`).join("") || `<p class="empty card" style="margin-top:1rem">Nenhuma atividade ${f.calDay ? "neste dia" : "com esse filtro"}.</p>`}`;
}

function vLotes() {
  const f = U.filtros.lotes;
  const groups = { ativos: ["crescendo", "pronto", "producao"], planejados: ["planejado"], colhidos: ["colhido"] };
  const cnt = k => S.lots.filter(l => groups[k].includes(lotSt(l).k)).length;
  const list = S.lots.filter(l => groups[f].includes(lotSt(l).k)).sort((a, b) => (a.prev || "9").localeCompare(b.prev || "9"));
  return `<div class="spread" style="flex-wrap:wrap;margin-bottom:.8rem"><div class="chips" role="group" aria-label="Filtrar lotes">${[["ativos", "No campo"], ["planejados", "Planejados"], ["colhidos", "Colhidos"]].map(([k, t]) => `<button type="button" class="chip" data-action="lotesf" data-k="${k}" aria-pressed="${f === k}"><span class="ck">${icon("check")}</span>${t} (${cnt(k)})</button>`).join("")}</div>
    <button class="btn btn-primary" type="button" data-action="lote-novo">${icon("plus")}Cadastrar plantio ou criação</button></div>
    <div class="grid3">${list.map(lotCard).join("") || `<p class="empty card">Nenhum lote aqui.</p>`}</div>`;
}
function lotCard(l) {
  const st = lotSt(l);
  let prog = "";
  if (st.k === "crescendo" || st.k === "pronto") {
    const tot = Math.max(1, (parseD(l.prev) - parseD(l.plantio)) / 864e5), passou = Math.min(tot, Math.max(0, -diffDays(l.plantio)));
    prog = `<div class="small muted" style="margin-top:.5rem">Dia ${Math.round(passou)} de ${Math.round(tot)} do ciclo</div><div class="progress" aria-hidden="true"><div style="width:${Math.round(passou / tot * 100)}%"></div></div>`;
  }
  return `<button type="button" class="card card-btn ${U.flash === l.id ? "flash" : ""}" data-action="lote" data-id="${l.id}">
    <div class="row" style="align-items:flex-start"><span class="emo-box">${l.emo}</span><div style="flex:1;min-width:0">
    <strong style="font-size:1.1rem">${esc(l.nome)}</strong><div class="row-wrap" style="margin-top:.2rem"><span class="pill pill-neutral">Lote ${l.code}</span><span class="pill ${st.cls}">${icon(st.ic)}${st.txt}</span>${syncTag(l)}</div></div></div>
    <div style="margin-top:.6rem" class="small">${l.cat === "Animal" ? "Chegada" : st.k === "planejado" ? "Plantar em" : "Plantado em"}: <strong>${relDay(l.plantio)}</strong> · ${fmtN(l.qtd)} ${esc(l.un)}</div>
    ${l.colhido ? `<div class="small">Colhido: <strong>${relDay(l.colhido)}</strong> · ${fmtN(l.colhidoQtd)} ${esc(l.colhidoUn)}</div>` : l.prev ? `<div class="small">Colheita prevista: <strong>${relDay(l.prev)}</strong></div>` : `<div class="small">${esc(l.obs || "")}</div>`}
    ${prog}</button>`;
}

function vPerdas() {
  const f = U.filtros, days = PER[f.lossPer];
  const ls = lossesIn(days).sort((a, b) => b.data.localeCompare(a.data) || b.t - a.t);
  const tot = ls.reduce((s, l) => s + lossKg(l), 0);
  const keyF = f.lossBy === "etapa" ? l => l.etapa : l => l.causa;
  const agg = {};
  ls.forEach(l => { const k = keyF(l); agg[k] = agg[k] || { kg: 0, n: 0 }; agg[k].kg += lossKg(l); agg[k].n++; });
  const rows = Object.entries(agg).sort((a, b) => b[1].kg - a[1].kg);
  const max = rows.length ? rows[0][1].kg : 1;
  const etIc = k => (ETAPAS.find(e => e.k === k) || {}).ic || "trendDown";
  const per = `<div class="chips" role="group" aria-label="Período">${[["semana", "Semana"], ["mes", "Mês"], ["trimestre", "Trimestre"]].map(([k, t]) => `<button type="button" class="chip" data-action="lossper" data-k="${k}" aria-pressed="${f.lossPer === k}"><span class="ck">${icon("check")}</span>${t}</button>`).join("")}</div>`;
  const by = `<div class="chips" role="group" aria-label="Agrupar por">${[["etapa", "Por etapa", "layers"], ["causa", "Por causa", "help"]].map(([k, t, ic]) => `<button type="button" class="chip" data-action="lossby" data-k="${k}" aria-pressed="${f.lossBy === k}"><span class="ck">${icon("check")}</span>${icon(ic)}${t}</button>`).join("")}</div>`;
  const topRow = rows[0];
  return `<div class="spread" style="flex-wrap:wrap;margin-bottom:.9rem">${per}<button class="btn btn-primary" type="button" data-action="perda">${icon("plus")}Registrar perda</button></div>
  <div class="grid2">
    <section class="card" aria-labelledby="h-lt"><h2 id="h-lt" style="font-size:1.1rem" class="row">${icon("chart")}Quanto se perdeu</h2>
      <p style="margin-top:.4rem"><span class="qty">≈ ${fmtN(tot)} <small>kg</small></span></p>
      <p class="muted">${ls.length} ${plural(ls.length, "registro", "registros")} nos ${PER_TXT[f.lossPer]}.</p>
      ${topRow ? `<p class="review" style="margin-top:.7rem">${icon("info")} <strong>Onde mais se perde:</strong> ${esc(topRow[0])} (${Math.round(topRow[1].kg / (tot || 1) * 100)}% do total).</p>` : ""}
      <p class="small muted" style="margin-top:.6rem">Pés, maços e dúzias foram convertidos em kg aproximado para poder somar.</p>
    </section>
    <section class="card" aria-labelledby="h-lg"><div class="spread" style="flex-wrap:wrap;margin-bottom:.7rem"><h2 id="h-lg" style="font-size:1.1rem" class="row">${icon("chart")}Perdas ${f.lossBy === "etapa" ? "por etapa" : "por causa"}</h2>${by}</div>
      ${rows.length ? `<div class="bars" role="list">${rows.map(([k, v], i) => `<div role="listitem"><div class="bar-top"><span class="row">${f.lossBy === "etapa" ? icon(etIc(k)) : ""}${esc(k)}</span><span class="num">≈ ${fmtN(v.kg)} kg · ${v.n} ${plural(v.n, "vez", "vezes")}</span></div><div class="bar-track" aria-hidden="true"><div class="bar-fill ${i === 0 ? "top" : ""}" style="width:${Math.max(3, v.kg / max * 100)}%"></div></div></div>`).join("")}</div><p class="small muted" style="margin-top:.6rem">A barra listrada é a maior perda do período.</p>` : `<p class="empty">Nenhuma perda neste período.</p>`}
    </section>
  </div>
  <div class="section-h section"><h2>${icon("note")}Histórico de perdas</h2><span class="muted small">${PER_TXT[f.lossPer]}</span></div>
  <div class="list-box">${ls.map(l => { const it = item(l.itemId); return `<button type="button" class="list-row ${U.flash === l.id ? "flash" : ""}" data-action="perda-ver" data-id="${l.id}">
    <span class="when">${relDay(l.data)}</span><span class="emo-box" style="width:2.6rem;height:2.6rem;font-size:1.3rem">${it ? it.emo : "📦"}</span>
    <span style="flex:1;min-width:0"><strong>${unQ(it, l.qtd)} de ${esc(it ? it.nome : "item")}</strong><br>
    <span class="row-wrap" style="margin-top:.2rem"><span class="pill pill-neutral">${icon(etIc(l.etapa))}${l.etapa}</span><span class="small">${esc(l.causa)}</span>${syncTag(l)}</span></span>${icon("chevron")}</button>`; }).join("") || `<p class="empty">Nenhuma perda registrada neste período.</p>`}</div>`;
}

function vTransporte() {
  const sh = S.ships.slice().sort((a, b) => (a.status === "agendada" ? -1 : 1) - (b.status === "agendada" ? -1 : 1) || b.data.localeCompare(a.data));

  return `<div class="spread" style="flex-wrap:wrap;margin-bottom:.9rem"><p class="muted">Organize a saída dos produtos e veja o que chegou danificado.</p>

    <div class="card sev-ok"><div class="row">${icon("truck", "ic-lg")}<div><div class="muted">Enviado (últimos 30 dias)</div><div class="qty">≈ ${fmtN(env)} <small>kg</small></div></div></div></div>

    <div class="stack" style="margin-top:.7rem;gap:.3rem">

  return `<div class="chips" role="group" aria-label="Pessoa" style="margin-bottom:.6rem"><button type="button" class="chip" data-action="logf" data-k="todos" aria-pressed="${f === "todos"}"><span class="ck">${icon("check")}</span>Todos</button>${S.people.filter(p => p.status === "ativo").map(p => `<button type="button" class="chip" data-action="logf" data-k="${p.id}" aria-pressed="${f === p.id}"><span class="ck">${icon("check")}</span>${esc(p.curto)}</button>`).join("")}</div>
  ${Object.entries(byDay).map(([d, ls]) => `<h3 class="group-h">${relDay(d)}</h3><div class="list-box">${ls.map(l => { const p = person(l.quem); return `<div class="list-row">${avatar(p, true)}<span style="flex:1"><strong>${esc(p.curto)}</strong> ${esc(l.txt)}<br><span class="small muted">${icon(l.ic)} ${hm(l.t)}</span></span></div>`; }).join("")}</div>`).join("") || `<p class="empty card">Nada registrado ainda.</p>`}`;
}
</script>
<script>
/* =========================================================
   FORMULÁRIOS: estoque, perdas, produção, transporte
   ========================================================= */
const r2 = n => Math.round(n * 100) / 100;
function effect(m) { return m.tipo === "entrada" ? m.qtd : -m.qtd; }
function applyMov(m, sign) { const it = item(m.itemId); if (it) it.qtd = Math.max(0, r2(it.qtd + sign * effect(m))); }
function goTo(route, tab) { if (tab) U.tabs[route] = tab; if (location.hash !== "#" + route) location.hash = route; else render(); }
function flash(id) { U.flash = id; setTimeout(() => { if (U.flash === id) U.flash = null; }, 2600); }

function itemGrid(sel, filterFn = () => true) {
  const sec = (tipo, t) => { const l = S.items.filter(i => i.tipo === tipo && filterFn(i)); return l.length ? `<div class="group-h">${t}</div><div class="opt-grid">${l.map(i => optBtn(i.id, esc(i.nome), `tem ${fmtN(i.qtd)} ${esc(i.un)}`, sel === i.id, `<span class="emo">${i.emo}</span>`)).join("")}</div>` : ""; };
  return sec("produto", "Produtos da roça") + sec("insumo", "Insumos");
}
function wireSearch(root, inputId, groupSel) {
  const inp = root.querySelector("#" + inputId);
  inp && inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    $$(groupSel + " .opt", root).forEach(o => { o.hidden = q && !o.textContent.toLowerCase().includes(q); });
  });
}

/* ---------- Movimentação de estoque ---------- */
function movForm(opts = {}) {
  const ed = opts.edit;
  const F = { tipo: ed ? ed.tipo : opts.tipo || null, itemId: ed ? ed.itemId : opts.itemId || null, data: ed ? ed.data : D(0), motivo: ed ? ed.motivo || null : null };
  const motivos = () => F.tipo === "entrada" ? ["Colheita", "Compra", "Coleta", "Doação ou troca"] : F.tipo === "saida" ? ["Venda", "Consumo da família", "Uso na roça", "Doação"] : [];
  const hp = helpToggle("h-mv", "Entrada é tudo que chega no estoque (colheita, compra). Saída é tudo que sai (venda, uso, consumo). O saldo é atualizado na hora.");
  const body = `<p class="muted" style="margin-bottom:1rem">Leva menos de um minuto. Os campos com número são obrigatórios.</p>
    <div class="field"><span class="flabel"><span class="qn">1</span>Entrou ou saiu do estoque? ${hp.btn}</span>${hp.box}
      <div class="opt-grid" data-group="tipo" style="grid-template-columns:1fr 1fr">${optBtn("entrada", "Entrada", "Chegou no estoque", F.tipo === "entrada", icon("arrowIn", "ic-big"))}${optBtn("saida", "Saída", "Saiu do estoque", F.tipo === "saida", icon("arrowOut", "ic-big"))}</div>${errBox("tipo")}</div>
    <div class="field"><span class="flabel"><span class="qn">2</span>Qual item?</span>
      <input type="search" id="mv-busca" placeholder="Procurar pelo nome (opcional)" aria-label="Procurar item">
      <div data-group="itemId" id="mv-items">${itemGrid(F.itemId)}</div>
      <button type="button" class="btn btn-ghost btn-sm" data-local="novo-item" style="margin-top:.4rem">${icon("plus")}O item não está na lista? Cadastrar novo</button>${errBox("itemId")}</div>
    <div class="field"><label for="mv-qtd"><span class="qn">3</span>Quantidade</label>${stepper("mv-qtd", ed ? ed.qtd : "", F.itemId ? item(F.itemId).un : "", "quantidade")}<p class="hint" id="mv-qtd-hint">Use os botões − e + ou digite. Ex.: 5 ou 2,5</p>${errBox("mv-qtd")}</div>
    <div class="field"><span class="flabel"><span class="qn">4</span>Quando?</span>${dateChips("data", F.data)}</div>
    <div class="field"><span class="flabel">Motivo <span class="opt-tag">(opcional)</span></span><div class="chips" data-group="motivo" id="mv-mot"></div></div>
    <div class="review" id="mv-rev" aria-live="polite"></div>`;
  const foot = `<button class="btn btn-secondary" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="button" id="mv-save">${icon("check")}Confirmar</button>`;
  openSheet({ title: ed ? "Corrigir movimentação" : "Registrar movimentação", body, foot, back: "Cancelar", onMount: root => {
    const base = () => { const it = item(F.itemId); if (!it) return 0; return ed && ed.itemId === it.id ? r2(it.qtd - effect(ed)) : it.qtd; };
    const upd = () => {
      root.querySelector("#mv-mot").innerHTML = motivos().map(m => chipBtn(m, m, F.motivo === m)).join("") || '<span class="muted small">Escolha primeiro se é entrada ou saída.</span>';
      const it = item(F.itemId), q = parseN(root.querySelector("#mv-qtd").value);
      root.querySelector("#mv-qtd-un").textContent = it ? it.un : "";
      root.querySelector("#mv-save").innerHTML = icon("check") + (F.tipo === "entrada" ? "Confirmar entrada" : F.tipo === "saida" ? "Confirmar saída" : "Confirmar");
      const rev = root.querySelector("#mv-rev");
      if (!it || !F.tipo || !(q > 0)) { rev.className = "review"; rev.innerHTML = `<h3>${icon("info")}Confira antes de salvar</h3><p class="muted">Escolha entrada ou saída, o item e a quantidade para ver o novo saldo.</p>`; return; }
      const b = base(), novo = F.tipo === "entrada" ? b + q : b - q;
      const over = F.tipo === "saida" && q > b;
      rev.className = "review" + (over ? " warn" : "");
      rev.innerHTML = `<h3>${icon(over ? "warn" : "info")}Confira antes de salvar</h3><p>${F.tipo === "entrada" ? "Entrada" : "Saída"} de <strong>${fmtN(q)} ${esc(it.un)}</strong> de <strong>${esc(it.nome)}</strong> · ${relDay(readDate(root, F, "data") || D(0)).toLowerCase()}</p>
        <p class="saldo" style="margin-top:.35rem"><span>Saldo: ${fmtN(b)}</span>${icon("chevron")}<span>${fmtN(Math.max(0, novo))} ${esc(it.un)}</span></p>
        ${over ? `<p style="margin-top:.3rem"><strong>A saída é maior que o estoque registrado (${fmtN(b)} ${esc(it.un)}).</strong> Ao confirmar, vamos perguntar se a diferença é uma perda.</p>` : ""}`;
    };
    wireForm(root, F, (n) => { if (n === "tipo") F.motivo = null; if (n === "data") showOther(root, "data", F); upd(); });
    wireSearch(root, "mv-busca", "#mv-items");
    root.addEventListener("change", e => { if (e.target.id === "data-date") upd(); });
    root.querySelector("[data-local=novo-item]").onclick = () => itemForm({ onSaved: it => { F.itemId = it.id; root.querySelector("#mv-items").innerHTML = itemGrid(F.itemId); upd(); } });
    upd();
    root.querySelector("#mv-save").onclick = async () => {
      const it = item(F.itemId), raw = root.querySelector("#mv-qtd").value.trim(), q = parseN(raw);
      let ok = true;
      if (!F.tipo) { setErr(root, "tipo", "Escolha se o item entrou ou saiu do estoque."); ok = false; }
      if (!it) { setErr(root, "itemId", "Escolha o item na lista."); ok = false; }
      if (!raw) ok = setErr(root, "mv-qtd", "Não foi possível salvar porque a quantidade está vazia. Informe a quantidade para continuar.") && ok;
      else if (!(q > 0)) ok = setErr(root, "mv-qtd", "A quantidade precisa ser um número maior que zero. Ex.: 5 ou 2,5.") && ok;
      const data = readDate(root, F, "data");
      if (!ok) { const fe = root.querySelector('[aria-invalid="true"], .err:not([hidden])'); fe && fe.scrollIntoView({ block: "center" }); return; }
      const b = base();
      let qSave = q, diff = 0;
      if (F.tipo === "saida" && q > b) {
        const ans = await dialog({ title: "A quantidade retirada é maior que o estoque registrado.", msg: `Você está tirando <strong>${fmtN(q)} ${esc(it.un)}</strong> de ${esc(it.nome)}, mas o estoque mostra <strong>${fmtN(b)} ${esc(it.un)}</strong>. Essa diferença de <strong>${fmtN(q - b)} ${esc(it.un)}</strong> corresponde a uma perda?`,
          buttons: [{ t: "Sim, registrar perda", v: "perda", cls: "btn-primary", ic: "trendDown" }, { t: "Não, revisar quantidade", v: "revisar", cls: "btn-secondary", ic: "edit" }] });
        if (ans !== "perda") { const inp = root.querySelector("#mv-qtd"); inp.focus(); inp.select(); setErr(root, "mv-qtd", `Revise a quantidade. O estoque registrado de ${esc(it.nome)} é ${fmtN(b)} ${esc(it.un)}.`); return; }
        diff = r2(q - b); qSave = b;
      }
      const sn = snap();
      let m;
      if (ed) { applyMov(ed, -1); Object.assign(ed, { tipo: F.tipo, itemId: it.id, qtd: qSave, data, motivo: F.motivo }); stamp(ed); applyMov(ed, 1); m = ed; log(`corrigiu um registro de ${F.tipo === "entrada" ? "entrada" : "saída"} de ${it.nome}`, "edit"); }
      else if (qSave > 0) { m = stamp({ id: uid("m"), itemId: it.id, tipo: F.tipo, qtd: qSave, data, por: S.me, motivo: F.motivo, t: Date.now() }); S.movs.push(m); applyMov(m, 1); log(`registrou ${F.tipo === "entrada" ? "entrada" : "saída"} de ${fmtN(qSave)} ${it.un} de ${it.nome}${F.motivo ? " (" + F.motivo + ")" : ""}`, F.tipo === "entrada" ? "arrowIn" : "arrowOut"); }
      save(); closeTop();
      flash(it.id); U.tabs.estoque = it.tipo === "produto" ? "produtos" : "insumos"; U.filtros.estoqueSt = null;
      goTo("estoque");
      const st = stockSt(it);
      toast(`${ed ? "Correção salva" : F.tipo === "entrada" ? "Entrada registrada" : "Saída registrada"}. Novo saldo de ${esc(it.nome)}: <strong>${fmtN(it.qtd)} ${esc(it.un)}</strong>.${st.k !== "ok" ? ` Atenção: ${st.txt.toLowerCase()}.` : ""}${!U.online ? " Guardado no celular." : ""}`, st.k === "ok" ? "ok" : "warn", () => restore(sn));
      if (diff > 0) setTimeout(() => lossForm({ itemId: it.id, qtd: diff, etapa: "Armazenamento", semDesconto: true, nota: `Diferença encontrada ao registrar saída de ${fmtN(q)} ${it.un}.` }), 350);
    };
  } });
}

/* ---------- Cadastro de item / insumo ---------- */
const EMOS = { semente: "🌱", adubo: "🪴", esterco: "🪴", calcário: "🪨", calda: "🧴", ração: "🌽", milho: "🌽", alface: "🥬", tomate: "🍅", cenoura: "🥕", couve: "🌿", abobrinha: "🥒", ovo: "🥚", mandioca: "🍠", leite: "🥛", feijão: "🫘" };
function itemForm(opts = {}) {
  const ed = opts.edit;
  const F = { tipo: ed ? ed.tipo : U.tabs.estoque === "insumos" ? "insumo" : "produto", un: ed ? ed.un : null };
  const UNS = ["kg", "sacos", "litros", "pacotes", "unidades", "maços", "dúzias", "pés"];
  const sugs = ["Sementes de cenoura", "Esterco curtido", "Calcário", "Calda bordalesa", "Milho para as galinhas"];
  const body = `<div class="field"><span class="flabel"><span class="qn">1</span>O que é?</span><div class="opt-grid" data-group="tipo" style="grid-template-columns:1fr 1fr">${optBtn("produto", "Produto da roça", "O que você colhe ou cria", F.tipo === "produto", icon("basket", "ic-big"))}${optBtn("insumo", "Insumo", "Semente, adubo, ração, calda", F.tipo === "insumo", icon("flask", "ic-big"))}</div></div>
    <div class="field"><label for="it-nome"><span class="qn">2</span>Nome</label><input type="text" id="it-nome" value="${esc(ed ? ed.nome : "")}" placeholder="Ex.: Sementes de cenoura" autocomplete="off">${errBox("it-nome")}
      ${ed ? "" : `<div class="chips" style="margin-top:.5rem" aria-label="Sugestões">${sugs.map(s => `<button type="button" class="chip" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>`}</div>
    <div class="field"><span class="flabel"><span class="qn">3</span>Como você conta?</span><div class="chips" data-group="un">${UNS.map(u => chipBtn(u, u, F.un === u)).join("")}</div>${errBox("un")}</div>
    ${ed ? "" : `<div class="field"><label for="it-qtd"><span class="qn">4</span>Quanto tem hoje?</label>${stepper("it-qtd", 0, F.un || "", "quantidade inicial")}${errBox("it-qtd")}</div>`}
    <div class="field"><label for="it-min">Avisar quando ficar abaixo de</label>${stepper("it-min", ed ? ed.min : 0, F.un || "", "mínimo")}<p class="hint" id="it-min-hint">Quando o estoque ficar abaixo desse número, o Campo Claro avisa com o sinal ${icon("warn")} Estoque baixo.</p></div>`;
  const foot = `<button class="btn btn-secondary" type="button" data-close>Cancelar</button><button class="btn btn-primary" type="button" id="it-save">${icon("check")}${ed ? "Salvar alterações" : "Cadastrar item"}</button>`;
  openSheet({ title: ed ? "Editar item" : "Cadastrar item", body, foot, back: "Cancelar", onMount: root => {
    wireForm(root, F, n => { if (n === "un") $$(".unit", root).forEach(u => u.textContent = F.un); });
    $$("[data-sug]", root).forEach(b => b.onclick = () => { root.querySelector("#it-nome").value = b.dataset.sug; F.tipo = "insumo"; $$('[data-group=tipo] [data-v]', root).forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === "insumo"))); setErr(root, "it-nome", ""); });
    root.querySelector("#it-save").onclick = () => {
      const nome = root.querySelector("#it-nome").value.trim();
      let ok = setErr(root, "it-nome", nome ? "" : "Escreva o nome do item. Ex.: Sementes de cenoura.");
      if (nome && !ed && S.items.some(i => i.nome.toLowerCase() === nome.toLowerCase())) ok = setErr(root, "it-nome", "Já existe um item com esse nome. Escolha ele na lista ou use outro nome.");
      if (!F.un) { setErr(root, "un", "Escolha como você conta esse item (kg, sacos…)."); ok = false; }
      const q = ed ? ed.qtd : parseN(root.querySelector("#it-qtd").value) || 0;
      const mn = parseN(root.querySelector("#it-min").value) || 0;
      if (!ok) return;
      const low = nome.toLowerCase(); const emo = Object.entries(EMOS).find(([k]) => low.includes(k));
      let it;
      if (ed) { Object.assign(ed, { nome, un: F.un, min: mn, tipo: F.tipo }); stamp(ed); it = ed; log(`editou o item ${nome}`, "edit"); }
      else { it = stamp({ id: uid("i"), key: low.split(" ")[0], nome, emo: emo ? emo[1] : "📦", tipo: F.tipo, un: F.un, qtd: q, min: mn, kgU: F.un === "kg" ? 1 : 1 }); S.items.push(it); log(`cadastrou o item ${nome}`, "plus"); }
      save(); closeTop();
      if (opts.onSaved) { opts.onSaved(it); toast(`${esc(nome)} cadastrado e selecionado.`); return; }
      flash(it.id); U.tabs.estoque = it.tipo === "produto" ? "produtos" : "insumos"; goTo("estoque");
      toast(`${esc(nome)} ${ed ? "atualizado" : "cadastrado"}. Saldo: ${fmtN(it.qtd)} ${esc(it.un)}.`);
    };
  } });
}
function itemView(id) {
  const it = item(id); if (!it) return;
  const ms = S.movs.filter(m => m.itemId === id).sort((a, b) => b.data.localeCompare(a.data) || b.t - a.t);
  const body = `<div class="card ${stockSt(it).sev}"><div class="row"><span class="emo-box">${it.emo}</span><div><strong style="font-size:1.2rem">${esc(it.nome)}</strong><div class="qty">${fmtN(it.qtd)} <small>${esc(it.un)}</small></div></div></div>
      <div class="row-wrap" style="margin-top:.6rem">${stPill(it)}<span class="pill pill-neutral">${it.tipo === "produto" ? "Produto da roça" : "Insumo"}</span></div>
      <p class="small muted" style="margin-top:.5rem">Mínimo combinado: ${fmtN(it.min)} ${esc(it.un)}. Abaixo disso aparece o aviso de estoque baixo.</p></div>
    <div class="row-wrap" style="margin-top:.8rem"><button class="btn btn-secondary btn-sm" type="button" data-local="perda">${icon("trendDown")}Registrar perda deste item</button><button class="btn btn-ghost btn-sm" type="button" data-local="editar">${icon("edit")}Editar item</button>${isG() ? `<button class="btn btn-ghost btn-sm" type="button" data-local="excluir" style="color:var(--critico)">${icon("trash")}Excluir item</button>` : ""}</div>
    <div class="section-h section"><h2>${icon("note")}Entradas e saídas</h2></div>
    <div class="list-box">${ms.map(movRow).join("") || `<p class="empty">Nenhuma movimentação ainda.</p>`}</div>`;
  openSheet({ title: esc(it.nome), body, foot: `<button class="btn btn-primary" type="button" data-local="mov">${icon("arrowOut")}Registrar movimentação</button>`, onMount: root => {
    root.addEventListener("click", async e => {
      const b = e.target.closest("[data-local]"); if (!b) return;
      const k = b.dataset.local;
      if (k === "mov") { closeTop(); movForm({ itemId: id }); }
      if (k === "perda") { closeTop(); lossForm({ itemId: id }); }
      if (k === "editar") { closeTop(); itemForm({ edit: it }); }
      if (k === "excluir") {
        if (await confirmDel(`Excluir ${esc(it.nome)}?`, `O item e as ${ms.length} movimentações dele saem do estoque. Os registros de perdas continuam no histórico.`)) {

          toast(`${esc(it.nome)} foi excluído.`, "info", () => restore(sn));
        }
      }
    });
  } });
}
async function delMov(id) {
  const m = S.movs.find(x => x.id === id); const it = item(m.itemId);
  const novo = Math.max(0, r2(it.qtd - effect(m)));
  if (!await confirmDel(`Excluir esta ${m.tipo === "entrada" ? "entrada" : "saída"}?`, `${m.tipo === "entrada" ? "Entrada" : "Saída"} de ${fmtN(m.qtd)} ${esc(it.un)} de ${esc(it.nome)} (${relDay(m.data).toLowerCase()}). O saldo de ${esc(it.nome)} passa de ${fmtN(it.qtd)} para <strong>${fmtN(novo)} ${esc(it.un)}</strong>.`)) return;
  const sn = snap(); applyMov(m, -1); S.movs = S.movs.filter(x => x.id !== id); log(`excluiu um registro de ${m.tipo === "entrada" ? "entrada" : "saída"} de ${it.nome}`, "trash"); save(); closeAll(); flash(it.id); render();
  toast(`Registro excluído. Novo saldo de ${esc(it.nome)}: <strong>${fmtN(it.qtd)} ${esc(it.un)}</strong>.`, "info", () => restore(sn));
}

/* ---------- Registro de perda ---------- */
function lossForm(opts = {}) {
  const ed = opts.edit;
  const F = { itemId: ed ? ed.itemId : opts.itemId || null, causa: ed ? (CAUSAS.includes(ed.causa) ? ed.causa : "Outra causa") : null, etapa: ed ? ed.etapa : opts.etapa || null, destino: ed ? ed.destino : null, data: ed ? ed.data : D(0), foto: ed ? ed.foto || null : null, descontar: ed ? !!ed.descontou : opts.etapa === "Armazenamento" && !opts.semDesconto, tocouDesc: false };
